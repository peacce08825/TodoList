<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 할 일 · 1L Daily</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f7f5f1; --card:#fbfaf7; --ink:#2a2723; --muted:#8a847b; --line:#e6e2da;
  --navy:#1f3a6e; --torts:#1a9a8d; --contracts:#7c4dcc; --civpro:#e08a2b; --ls:#c93e5c; --mr:#b5782b; --etc:#6b7f95;
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:110px}
header{position:sticky;top:0;background:rgba(247,245,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px 10px;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:6px}
.nav button{background:none;border:none;font-size:22px;padding:4px 10px;color:var(--ink);cursor:pointer}
.today-btn{font-size:13px;border:1px solid var(--line) !important;border-radius:10px;padding:5px 10px !important}
h1{font-size:24px;margin:8px 0 2px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink);cursor:pointer}
.progress{height:6px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--navy);width:0;transition:width .3s;border-radius:6px}
main{padding:14px 16px}
.section-label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:14px 4px 8px;text-transform:uppercase}
.task{display:flex;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px 14px 12px 12px;margin-bottom:10px;border:1px solid #efece6;position:relative}
.task.done{opacity:.55}
.task.done .title-text{text-decoration:line-through}
.check{flex:none;width:26px;height:26px;border:2px solid #cfc9bf;border-radius:8px;margin-top:2px;background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px}
.task.done .check{background:var(--navy);border-color:var(--navy)}
.bar{flex:none;width:4px;border-radius:4px;align-self:stretch}
.body{flex:1;min-width:0}
.title{font-weight:600;font-size:16px;line-height:1.3}
.title-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.title-text{font-weight:600;font-size:16px;line-height:1.3;outline:none;min-width:20px}
.title-text:focus{background:#fff;border-radius:6px;padding:2px 5px;box-shadow:0 0 0 2px #dcd7ce}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.memo{margin-top:6px;font-size:14px;line-height:1.5;color:#5a554d;white-space:pre-wrap;border:none;background:transparent;width:100%;font-family:inherit;resize:none;padding:0;min-height:20px;outline:none}
.memo:empty:before,.memo[data-empty="1"]:before{content:"메모: 리딩 범위 · 판례 · 페이지…";color:#b8b2a8}
.memo:focus{background:#fff;border-radius:8px;padding:6px 8px;box-shadow:0 0 0 2px #dcd7ce}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:#efece6;color:#6d675d;margin-left:6px;vertical-align:middle}
.tag.warn{background:#fde8e8;color:#b83232}
.task .del{position:absolute;right:10px;top:10px;background:none;border:none;color:#c4beb3;font-size:16px;cursor:pointer;padding:4px}
.class-card{border:1.5px dashed var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;color:#7d776e}
.class-card .bar{opacity:.9}
.class-card b{display:block;color:#7d776e;font-size:15px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;line-height:1.6}
.fab{position:fixed;bottom:22px;left:16px;right:16px;display:flex;gap:10px;z-index:6}
.fab button{flex:1;border:none;border-radius:16px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.fab .primary{background:var(--navy);color:#fff}
.fab .secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
.sheet-bg.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:14px 20px 34px;max-height:88vh;overflow:auto}
.handle{width:44px;height:5px;background:#ddd;border-radius:5px;margin:0 auto 14px}
.sheet h2{font-size:19px;margin:6px 0 14px}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;background:#faf9f6;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-navy{background:var(--navy);color:#fff}.btn-ghost{background:#f1efe9;color:var(--ink)}
.preview{background:#f4f2ec;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-top:12px;color:#5a554d}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.list-item small{color:var(--muted);display:block;font-size:12px}
.list-item button{background:none;border:none;color:#b83232;font-size:13px;cursor:pointer;font-family:inherit}
.tpl-day{margin-top:14px;font-weight:600;font-size:14px}
.tpl-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:#faf9f6}
.tpl-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tpl-top input,.tpl-top select{padding:8px;font-size:13px;border-radius:9px;min-width:0}
.tpl-top .tt{flex:1 1 92px}
.tpl-top .tcourse{flex:1 1 108px}
.tpl-top .tdur{flex:0 0 54px;text-align:center}
.tpl-top .tdel{flex:none;background:none;border:none;color:#b83232;font-size:17px;cursor:pointer;padding:2px 4px}
.tpl-card .ttitle{margin-top:8px;width:100%;padding:8px;font-size:13px;border-radius:9px;border:1px solid var(--line)}
.small{font-size:12.5px;color:var(--muted);line-height:1.6}
.wheelpicker{position:relative;display:flex;align-items:center;height:160px;background:#faf9f6;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wheel-highlight{position:absolute;left:6px;right:6px;top:60px;height:40px;background:#eee9df;border-radius:10px;pointer-events:none;z-index:0}
.wheel-col{flex:1;height:160px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1}
.wheel-col::-webkit-scrollbar{display:none}
.wheel-pad{height:60px}
.wheel-item{height:40px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#c4beb3;scroll-snap-align:center;font-variant-numeric:tabular-nums;transition:color .15s}
.wheel-item.sel{color:var(--ink);font-weight:700}
.wheel-unit{width:26px;text-align:center;color:var(--muted);font-size:13px;z-index:1}
.cap{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cap div{text-align:center;font-size:12px;color:var(--muted)}
.cap input{padding:8px 4px;text-align:center;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="nav">
      <button onclick="shift(-1)">‹</button>
      <button onclick="shift(1)">›</button>
      <button class="today-btn" onclick="goToday()">오늘</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="icon-btn" onclick="openSheet('assignSheet')">📋 과제</button>
      <button class="icon-btn" onclick="openSheet('settingsSheet')">⚙️</button>
    </div>
  </div>
  <h1 id="dateTitle"></h1>
  <div class="sub" id="dateSub"></div>
  <div class="progress"><i id="prog"></i></div>
</header>

<main id="main"></main>

<div class="fab">
  <button class="secondary" onclick="openAddTask()">+ 이 날 할 일</button>
  <button class="primary" onclick="openAddAssign()">+ 과제 추가</button>
</div>

<!-- 과제 추가 -->
<div class="sheet-bg" id="addAssign" onclick="bgClose(event,'addAssign')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>과제 추가</h2>
    <p class="small">마감일과 예상 시간을 넣으면 마감 전 여유 있는 날에 자동으로 나눠서 배정돼요. (하루 최대 2시간씩)</p>
    <label>과제 이름</label><input id="aTitle" placeholder="예: Roadmap Exercise 초안">
    <div class="row">
      <div><label>과목</label><select id="aCourse"></select></div>
      <div><label>마감일</label><input id="aDue" type="date"></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>예상 소요 시간</label>
        <div class="wheelpicker">
          <div class="wheel-highlight"></div>
          <div class="wheel-col" id="wheelHour"></div>
          <div class="wheel-unit">시간</div>
          <div class="wheel-col" id="wheelMin"></div>
          <div class="wheel-unit">분</div>
        </div>
      </div>
      <div style="flex:1"><label>마감일 당일에도 할 수 있나요?</label><select id="aDueDay"><option value="0">아니오 (전날까지)</option><option value="1">네</option></select></div>
    </div>
    <label>메모</label><textarea id="aMemo" placeholder="제출 방식, 분량, 링크…"></textarea>
    <div class="preview" id="aPreview">마감일과 시간을 넣으면 배정 미리보기가 보여요.</div>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('addAssign')">취소</button><button class="btn-navy" onclick="saveAssign()">배정하기</button></div>
  </div>
</div>

<!-- 이 날 할 일 추가 -->
<div class="sheet-bg" id="addTask" onclick="bgClose(event,'addTask')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>이 날 할 일 추가</h2>
    <label>할 일</label><input id="tTitle" placeholder="예: 오피스아워 질문 정리">
    <div class="row">
      <div><label>과목</label><select id="tCourse"></select></div>
      <div><label>시간</label><input id="tTime" type="time" value="15:30"></div>
    </div>
    <label>메모</label><textarea id="tMemo"></textarea>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('addTask')">취소</button><button class="btn-navy" onclick="saveTask()">추가</button></div>
  </div>
</div>

<!-- 과제 목록 -->
<div class="sheet-bg" id="assignSheet" onclick="bgClose(event,'assignSheet')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>과제 목록</h2>
    <div id="assignList"></div>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('assignSheet')">닫기</button></div>
  </div>
</div>

<!-- 설정 -->
<div class="sheet-bg" id="settingsSheet" onclick="bgClose(event,'settingsSheet')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>주간 계획 편집</h2>
    <p class="small">매주 반복되는 기본 할 일이에요. 요일별로 시간·이름·분(分)을 바꾸면 그 요일 전체에 적용돼요.</p>
    <div id="tplEditor"></div>
    <h2 style="margin-top:26px">요일별 과제 여유 시간</h2>
    <p class="small">기본 계획 외에 과제에 쓸 수 있는 시간(분). 과제는 이 범위 안에서만 배정돼요.</p>
    <div class="cap" id="capEditor"></div>
    <h2 style="margin-top:26px">백업</h2>
    <div class="row">
      <button class="btn-ghost" style="border:none;border-radius:12px;padding:12px;font-family:inherit" onclick="exportJSON()">JSON 내보내기</button>
      <button class="btn-ghost" style="border:none;border-radius:12px;padding:12px;font-family:inherit" onclick="document.getElementById('importFile').click()">JSON 불러오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
    </div>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('settingsSheet')">닫기</button><button class="btn-navy" onclick="saveSettings()">저장</button></div>
  </div>
</div>

<script>
/* ---------- 데이터 ---------- */
const COURSES = {
  torts:{name:"Torts",color:"var(--torts)"},
  contracts:{name:"Contracts",color:"var(--contracts)"},
  civpro:{name:"Civil Procedure",color:"var(--civpro)"},
  ls:{name:"Lawyering Skills",color:"var(--ls)"},
  mr:{name:"Moral Reasoning",color:"var(--mr)"},
  etc:{name:"기타",color:"var(--etc)"}
};
const CLASSES = { // 0=일 1=월 ...
  1:[["torts","9:00","MSL 235"],["contracts","10:30","MSL 235"],["civpro","1:30 pm","MSL 321"]],
  2:[["ls","8:55","SCH 314"],["mr","10:30","Rm 321/235"],["civpro","1:30 pm","MSL 321"]],
  3:[["torts","9:00","MSL 235"],["contracts","10:30","MSL 235"]],
  4:[["ls","8:55","SCH 314"],["torts","10:30","MSL 235"],["civpro","1:30 pm","MSL 321"]],
  5:[["contracts","10:30","MSL 235"]]
};
// 기본 주간 계획 (dow, time, dur(min), course, title, memo)
const DEFAULT_TEMPLATE = [
  [1,"15:30",60,"etc","복습 (오늘 수업 3과목)","Torts·Contracts·CivPro 각 20분 — 교수님 질문 적기"],
  [1,"16:30",120,"civpro","예습 (교재+판례) — 화요일 수업",""],
  [1,"19:30",90,"ls","예습 — 화요일 Lawyering Skills + Moral Reasoning",""],
  [1,"21:00",180,"torts","예습 (교재+판례) — 수요일 수업",""],
  [2,"15:30",30,"civpro","복습 (판례정리)",""],
  [2,"16:00",150,"contracts","예습 (교재+판례) — 수요일 수업","단어장 · 양측 논거까지"],
  [2,"19:30",90,"contracts","콜드콜 스크립트",""],
  [2,"21:00",90,"torts","콜드콜 스크립트 + 마무리",""],
  [3,"13:00",30,"etc","복습 (Torts·Contracts)","1:30–2:45 Torts 오피스아워 가능"],
  [3,"15:00",150,"torts","예습 (교재+판례) — 목요일 수업",""],
  [3,"18:30",120,"civpro","예습 (교재+판례) — 목요일 수업",""],
  [3,"20:30",60,"ls","예습 — 목요일 Lawyering Skills",""],
  [3,"21:30",60,"etc","콜드콜 스크립트 (Torts + CivPro)",""],
  [4,"15:30",30,"etc","복습 (Torts·CivPro)",""],
  [4,"16:00",150,"contracts","예습 (교재+판례) — 금요일 수업",""],
  [4,"19:30",90,"contracts","콜드콜 스크립트 + 단어장",""],
  [4,"21:00",120,"etc","주간 정리 — 케이스별 룰 한 줄씩 아웃라인에",""],
  [5,"13:00",30,"contracts","복습 (판례정리)","Grenardo 오피스아워 12–1:30"],
  [5,"13:30",150,"torts","예습 (교재+판례) — 월요일 수업",""],
  [5,"16:30",120,"contracts","예습 (교재+판례) — 월요일 수업",""],
  [5,"19:30",90,"civpro","예습 (교재+판례) — 월요일 수업",""],
  [5,"21:00",60,"etc","콜드콜 스크립트 3개 (Torts·Contracts·CivPro)",""],
  [0,"20:00",60,"etc","(선택) 월요일 스크립트 한 번 읽기 + 가방 챙기기",""]
].map((t,i)=>({id:"tpl"+i,dow:t[0],time:t[1],dur:t[2],course:t[3],title:t[4],memo:t[5]}));
const DEFAULT_CAP = {0:60,1:60,2:90,3:120,4:120,5:120,6:0};

const KEY="onel_daily_v1";
let S = load();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); s.template=s.template||DEFAULT_TEMPLATE; s.cap=s.cap||DEFAULT_CAP; s.done=s.done||{}; s.memos=s.memos||{}; s.titles=s.titles||{}; s.extras=s.extras||{}; s.assignments=s.assignments||[]; return s; } }catch(e){}
  return {template:DEFAULT_TEMPLATE, cap:{...DEFAULT_CAP}, done:{}, memos:{}, titles:{}, extras:{}, assignments:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- 날짜 ---------- */
let cur = new Date(); cur.setHours(0,0,0,0);
const DOW=["일","월","화","수","목","금","토"];
const iso = d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const fromISO = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function shift(n){cur.setDate(cur.getDate()+n);render()}
function goToday(){cur=new Date();cur.setHours(0,0,0,0);render()}
const fmtTime = t=>{let [h,m]=t.split(":").map(Number);const ap=h<12?"오전":"오후";if(h>12)h-=12;if(h===0)h=12;return `${ap} ${h}:${String(m).padStart(2,"0")}`};
const fmtDur = m=> m%60===0?`${m/60}h`:(m>60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`);

/* ---------- 스케줄러 ---------- */
function loadOn(dateStr){ // 그날 이미 배정된 과제 분
  return S.assignments.reduce((a,x)=>a+x.chunks.filter(c=>c.date===dateStr).reduce((b,c)=>b+c.min,0),0);
}
function planChunks(totalMin, dueStr, allowDueDay){
  const today=new Date();today.setHours(0,0,0,0);
  const due=fromISO(dueStr); const last=new Date(due); if(!allowDueDay) last.setDate(last.getDate()-1);
  const start=new Date(today); if(new Date().getHours()>=20) start.setDate(start.getDate()+1);
  const days=[]; for(let d=new Date(start); d<=last; d.setDate(d.getDate()+1)){
    const ds=iso(d); const free=(S.cap[d.getDay()]||0)-loadOn(ds); if(free>=30) days.push({date:ds,free});
  }
  let need=totalMin, chunks=[];
  // 마감 가까운 날은 아끼고, 여유 많은 날부터 (동률이면 빠른 날)
  days.sort((a,b)=>b.free-a.free || a.date.localeCompare(b.date));
  for(const d of days){ if(need<=0)break; const m=Math.min(need,d.free,120); chunks.push({date:d.date,min:m}); need-=m; }
  chunks.sort((a,b)=>a.date.localeCompare(b.date));
  let overflow=0;
  if(need>0){ const ds=iso(last<start?start:last); const ex=chunks.find(c=>c.date===ds); if(ex) ex.min+=need; else chunks.push({date:ds,min:need}); overflow=need; chunks.sort((a,b)=>a.date.localeCompare(b.date)); }
  return {chunks,overflow};
}
function previewAssign(){
  const totalMin=wheelHourVal*60+wheelMinVal, due=document.getElementById("aDue").value;
  const box=document.getElementById("aPreview");
  if(!totalMin||!due){box.textContent="마감일과 시간을 넣으면 배정 미리보기가 보여요.";return}
  const r=planChunks(totalMin, due, document.getElementById("aDueDay").value==="1");
  box.innerHTML = r.chunks.map(c=>{const d=fromISO(c.date);return `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]}) · ${fmtDur(c.min)}`}).join("<br>") + (r.overflow?`<br><span style="color:#b83232">⚠ ${fmtDur(r.overflow)}은 여유가 부족해서 마지막 날에 몰렸어요 — 마감 당일 허용이나 여유 시간 조정을 고려해요.</span>`:"");
}
document.getElementById("aDue").addEventListener("input",previewAssign);
document.getElementById("aDueDay").addEventListener("input",previewAssign);

/* ---------- 시간(소요시간) 휠 피커 ---------- */
let wheelHourVal=1, wheelMinVal=0;
function buildWheel(id, values, fmt, initial, onChange){
  const col=document.getElementById(id);
  col.innerHTML = `<div class="wheel-pad"></div>` + values.map(v=>`<div class="wheel-item" data-v="${v}">${fmt(v)}</div>`).join("") + `<div class="wheel-pad"></div>`;
  const items=[...col.querySelectorAll(".wheel-item")];
  function updateSel(scrollTo){
    const idx=Math.min(Math.max(Math.round(col.scrollTop/40),0),values.length-1);
    items.forEach((it,i)=>it.classList.toggle("sel",i===idx));
    onChange(values[idx]);
    if(scrollTo) col.scrollTo({top:idx*40,behavior:"smooth"});
    return idx;
  }
  let t;
  col.addEventListener("scroll",()=>{ updateSel(false); clearTimeout(t); t=setTimeout(()=>updateSel(true),120); });
  const startIdx=Math.max(0,values.indexOf(initial));
  col.scrollTop=startIdx*40;
  setTimeout(()=>updateSel(false),0);
}
function setupWheels(h,m){
  wheelHourVal=h; wheelMinVal=m;
  buildWheel("wheelHour",[...Array(11).keys()],v=>v,h,v=>{wheelHourVal=v;previewAssign();});
  buildWheel("wheelMin",[0,5,10,15,20,25,30,35,40,45,50,55],v=>String(v).padStart(2,"0"),m,v=>{wheelMinVal=v;previewAssign();});
}

/* ---------- 렌더 ---------- */
function render(){
  const ds=iso(cur), dow=cur.getDay();
  document.getElementById("dateTitle").textContent=`${cur.getMonth()+1}월 ${cur.getDate()}일 (${DOW[dow]})`;
  const items=[];
  S.template.filter(t=>t.dow===dow).forEach(t=>items.push({key:ds+":"+t.id,time:t.time,dur:t.dur,course:t.course,title:t.title,memoDefault:t.memo,type:"tpl"}));
  (S.extras[ds]||[]).forEach(t=>items.push({key:ds+":"+t.id,time:t.time,dur:0,course:t.course,title:t.title,memoDefault:t.memo,type:"extra",id:t.id}));
  S.assignments.forEach(a=>a.chunks.filter(c=>c.date===ds).forEach(c=>{
    const due=fromISO(a.due); const left=Math.round((due-cur)/86400000);
    items.push({key:ds+":"+a.id,time:"23:00",dur:c.min,course:a.course,title:a.title,memoDefault:a.memo,type:"assign",due:`마감 ${due.getMonth()+1}/${due.getDate()}`,left,aid:a.id});
  }));
  items.sort((a,b)=>a.time.localeCompare(b.time));
  const doneN=items.filter(i=>S.done[i.key]).length;
  document.getElementById("dateSub").textContent = items.length?`${doneN}/${items.length} 완료 · 총 ${fmtDur(items.reduce((a,i)=>a+i.dur,0))}`:(dow===6?"완전 휴식 🌿":"할 일 없음");
  document.getElementById("prog").style.width=(items.length?doneN/items.length*100:0)+"%";

  let html="";
  if(items.length){
    html+=`<div class="section-label">할 일</div>`;
    items.forEach(i=>{
      const memo = S.memos[i.key] ?? i.memoDefault ?? "";
      const title = S.titles[i.key] ?? i.title ?? "";
      const c=COURSES[i.course]||COURSES.etc;
      html+=`<div class="task ${S.done[i.key]?"done":""}">
        <div class="check" onclick="toggle('${i.key}')">${S.done[i.key]?"✓":""}</div>
        <div class="bar" style="background:${c.color}"></div>
        <div class="body">
          <div class="title-row"><span class="title-text" contenteditable="true" data-key="${i.key}" data-default="${esc(i.title)}" onblur="saveTitle(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(title)}</span>${i.type==="assign"?`<span class="tag ${i.left<=1?"warn":""}">과제 · ${i.due}</span>`:""}</div>
          <div class="meta">${c.name}${i.type==="assign"?"":" · "+fmtTime(i.time)}${i.dur?" · "+fmtDur(i.dur):""}</div>
          <div class="memo" contenteditable="true" data-key="${i.key}" data-empty="${memo?0:1}" onblur="saveMemo(this)" oninput="this.dataset.empty=this.textContent.trim()?0:1">${esc(memo)}</div>
        </div>
        ${i.type==="extra"?`<button class="del" onclick="delExtra('${ds}','${i.id}')">✕</button>`:""}
      </div>`;
    });
  } else html+=`<div class="empty">${dow===6?"토요일은 쉬는 날이에요.<br>푹 쉬어요 ☕":"이 날은 아직 할 일이 없어요.<br>아래에서 추가할 수 있어요."}</div>`;

  if(CLASSES[dow]){
    html+=`<div class="section-label">수업</div>`;
    CLASSES[dow].forEach(([k,t,room])=>{const c=COURSES[k];html+=`<div class="class-card"><div class="bar" style="background:${c.color}"></div><div><b>${c.name} 수업</b><span style="font-size:13px">${t.includes("pm")?"오후 "+t.replace(" pm",""):"오전 "+t} · ${room}</span></div></div>`});
  }
  document.getElementById("main").innerHTML=html;
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toggle(k){ if(S.done[k]) delete S.done[k]; else S.done[k]=1; save(); render(); }
function saveMemo(el){ const v=el.textContent.trim(); S.memos[el.dataset.key]=v; save(); }
function saveTitle(el){ const v=el.textContent.trim(); if(v) S.titles[el.dataset.key]=v; else { delete S.titles[el.dataset.key]; el.textContent=el.dataset.default; } save(); }
function delExtra(ds,id){ S.extras[ds]=(S.extras[ds]||[]).filter(t=>t.id!==id); save(); render(); }

/* ---------- 시트 ---------- */
function openSheet(id){ if(id==="assignSheet") renderAssignList(); if(id==="settingsSheet") renderSettings(); document.getElementById(id).classList.add("open"); }
function closeSheet(id){ document.getElementById(id).classList.remove("open"); }
function bgClose(e,id){ if(e.target.id===id) closeSheet(id); }
function fillCourses(sel){ sel.innerHTML=Object.entries(COURSES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join(""); }
fillCourses(document.getElementById("aCourse")); fillCourses(document.getElementById("tCourse"));

function openAddAssign(){ document.getElementById("aTitle").value="";document.getElementById("aMemo").value="";document.getElementById("aDue").value="";document.getElementById("aDueDay").value="0";setupWheels(1,0);previewAssign();openSheet("addAssign"); }
function saveAssign(){
  const title=document.getElementById("aTitle").value.trim(), totalMin=wheelHourVal*60+wheelMinVal, due=document.getElementById("aDue").value;
  if(!title||!totalMin||!due){alert("과제 이름, 마감일, 예상 시간을 채워주세요.");return}
  const r=planChunks(totalMin, due, document.getElementById("aDueDay").value==="1");
  S.assignments.push({id:"a"+Date.now(),title,course:document.getElementById("aCourse").value,due,min:totalMin,memo:document.getElementById("aMemo").value.trim(),chunks:r.chunks});
  save(); closeSheet("addAssign"); render();
}
function openAddTask(){ document.getElementById("tTitle").value="";document.getElementById("tMemo").value="";openSheet("addTask"); }
function saveTask(){
  const title=document.getElementById("tTitle").value.trim(); if(!title){alert("할 일을 적어주세요.");return}
  const ds=iso(cur); S.extras[ds]=S.extras[ds]||[];
  S.extras[ds].push({id:"x"+Date.now(),title,course:document.getElementById("tCourse").value,time:document.getElementById("tTime").value||"15:30",memo:document.getElementById("tMemo").value.trim()});
  save(); closeSheet("addTask"); render();
}
function renderAssignList(){
  const box=document.getElementById("assignList");
  if(!S.assignments.length){box.innerHTML=`<div class="empty">아직 추가된 과제가 없어요.</div>`;return}
  box.innerHTML=S.assignments.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(a=>{
    const done=a.chunks.every(c=>S.done[c.date+":"+a.id]);
    const plan=a.chunks.map(c=>{const d=fromISO(c.date);return `${d.getMonth()+1}/${d.getDate()} ${fmtDur(c.min)}`}).join(" · ");
    return `<div class="list-item"><div><span style="color:${COURSES[a.course].color}">●</span> ${done?"<s>":""}${esc(a.title)}${done?"</s>":""}<small>${COURSES[a.course].name} · 마감 ${a.due} · ${fmtDur(a.min)}</small><small>${plan}</small></div><button onclick="delAssign('${a.id}')">삭제</button></div>`;
  }).join("");
}
function delAssign(id){ if(!confirm("이 과제와 배정된 일정을 모두 지울까요?"))return; S.assignments=S.assignments.filter(a=>a.id!==id); save(); renderAssignList(); render(); }

function renderSettings(){
  const box=document.getElementById("tplEditor"); let html="";
  [1,2,3,4,5,6,0].forEach(d=>{
    html+=`<div class="tpl-day">${DOW[d]}요일 <button style="font-size:12px;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;margin-left:6px;font-family:inherit" onclick="addTpl(${d})">+ 추가</button></div>`;
    S.template.filter(t=>t.dow===d).sort((a,b)=>a.time.localeCompare(b.time)).forEach(t=>{
      html+=`<div class="tpl-card" data-id="${t.id}">
        <div class="tpl-top">
          <input type="time" value="${t.time}" class="tt">
          <select class="tcourse">${Object.entries(COURSES).map(([k,v])=>`<option value="${k}" ${t.course===k?"selected":""}>${v.name}</option>`).join("")}</select>
          <input type="number" value="${t.dur}" class="tdur" title="분">
          <button class="tdel" onclick="delTpl('${t.id}')">✕</button>
        </div>
        <input class="ttitle" value="${esc(t.title)}" placeholder="할 일 이름">
      </div>`;
    });
  });
  box.innerHTML=html;
  document.getElementById("capEditor").innerHTML=[1,2,3,4,5,6,0].map(d=>`<div>${DOW[d]}<input type="number" data-dow="${d}" value="${S.cap[d]||0}"></div>`).join("");
}
function addTpl(d){ collectSettings(); S.template.push({id:"tpl"+Date.now(),dow:d,time:"15:30",dur:60,course:"etc",title:"새 할 일",memo:""}); renderSettings(); }
function delTpl(id){ collectSettings(); S.template=S.template.filter(t=>t.id!==id); renderSettings(); }
function collectSettings(){
  document.querySelectorAll("#tplEditor .tpl-card").forEach(card=>{
    const t=S.template.find(x=>x.id===card.dataset.id); if(!t)return;
    t.time=card.querySelector(".tt").value||t.time; t.title=card.querySelector(".ttitle").value; t.dur=parseInt(card.querySelector(".tdur").value)||0;
    t.course=card.querySelector(".tcourse").value;
  });
  document.querySelectorAll("#capEditor input").forEach(i=>S.cap[i.dataset.dow]=parseInt(i.value)||0);
}
function saveSettings(){ collectSettings(); save(); closeSheet("settingsSheet"); render(); }

function exportJSON(){ const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`1L-daily-${iso(new Date())}.json`; a.click(); }
function importJSON(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ S=JSON.parse(r.result); S.template=S.template||DEFAULT_TEMPLATE; save(); render(); renderSettings(); alert("불러왔어요."); }catch(e){alert("파일을 읽지 못했어요.")} }; r.readAsText(f); }

render();
</script>
