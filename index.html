<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 할 일 · 1L Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1L Daily">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5B3AA6">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f7f5f1; --card:#fbfaf7; --ink:#2a2723; --muted:#8a847b; --line:#e6e2da;
  --navy:#1f3a6e; --torts:#1a9a8d; --contracts:#7c4dcc; --civpro:#e08a2b; --ls:#c93e5c; --mr:#b5782b; --etc:#6b7f95;
  --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:110px}
header{position:sticky;top:0;background:rgba(247,245,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px 10px;padding-top:calc(14px + env(safe-area-inset-top));z-index:5}
.top{display:flex;align-items:center;justify-content:space-between}
.nav{display:flex;align-items:center;gap:6px}
.nav button{background:none;border:none;font-size:22px;padding:4px 10px;color:var(--ink);cursor:pointer}
.today-btn{font-size:13px;border:1px solid var(--line) !important;border-radius:10px;padding:5px 10px !important}
h1{font-size:24px;margin:8px 0 2px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--ink);cursor:pointer}
.progress{height:6px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--navy);width:0;transition:width .3s;border-radius:6px}
main{padding:14px 16px}
.section-label{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:14px 4px 8px;text-transform:uppercase}
.task{display:flex;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px 14px 12px 12px;margin-bottom:10px;border:1px solid #efece6;position:relative}
.task.done{opacity:.55}
.task.done .title-text{text-decoration:line-through}
.check{flex:none;width:26px;height:26px;border:2px solid #cfc9bf;border-radius:8px;margin-top:2px;background:#fff;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:15px}
.task.done .check{background:var(--navy);border-color:var(--navy)}
.bar{flex:none;width:4px;border-radius:4px;align-self:stretch}
.body{flex:1;min-width:0}
.title-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.title-text{font-weight:600;font-size:16px;line-height:1.3;outline:none;min-width:20px}
.title-text:focus{background:#fff;border-radius:6px;padding:2px 5px;box-shadow:0 0 0 2px #dcd7ce}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.memo{margin-top:6px;font-size:14px;line-height:1.5;color:#5a554d;white-space:pre-wrap;border:none;background:transparent;width:100%;font-family:inherit;resize:none;padding:0;min-height:20px;outline:none}
.memo:empty:before,.memo[data-empty="1"]:before{content:"메모: 리딩 범위 · 판례 · 페이지…";color:#b8b2a8}
.memo:focus{background:#fff;border-radius:8px;padding:6px 8px;box-shadow:0 0 0 2px #dcd7ce}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:#efece6;color:#6d675d;margin-left:6px;vertical-align:middle}
.tag.warn{background:#fde8e8;color:#b83232}
.task .del{position:absolute;right:10px;top:10px;background:none;border:none;color:#c4beb3;font-size:16px;cursor:pointer;padding:4px}
.class-card{border:1.5px dashed var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;color:#7d776e}
.class-card .bar{opacity:.9}
.class-card b{display:block;color:#7d776e;font-size:15px;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;line-height:1.6}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:16px;right:16px;display:flex;gap:10px;z-index:6}
.fab button{flex:1;border:none;border-radius:16px;padding:16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.fab .primary{background:var(--navy);color:#fff}
.fab .secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:10}
.sheet-bg.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:14px 20px 34px;max-height:88vh;overflow:auto}
.handle{width:44px;height:5px;background:#ddd;border-radius:5px;margin:0 auto 14px}
.sheet h2{font-size:19px;margin:6px 0 14px;position:relative}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;background:#faf9f6;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
.btn-navy{background:var(--navy);color:#fff}.btn-ghost{background:#f1efe9;color:var(--ink)}
.preview{background:#f4f2ec;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-top:12px;color:#5a554d}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.list-item small{color:var(--muted);display:block;font-size:12px}
.list-item button{background:none;border:none;color:#b83232;font-size:13px;cursor:pointer;font-family:inherit}
.small{font-size:12.5px;color:var(--muted);line-height:1.6}
.wheelpicker{position:relative;display:flex;align-items:center;height:160px;background:#faf9f6;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wheel-highlight{position:absolute;left:6px;right:6px;top:60px;height:40px;background:#eee9df;border-radius:10px;pointer-events:none;z-index:0}
.wheel-col{flex:1;height:160px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1}
.wheel-col::-webkit-scrollbar{display:none}
.wheel-pad{height:60px}
.wheel-item{height:40px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#c4beb3;scroll-snap-align:center;font-variant-numeric:tabular-nums;transition:color .15s}
.wheel-item.sel{color:var(--ink);font-weight:700}
.wheel-unit{width:26px;text-align:center;color:var(--muted);font-size:13px;z-index:1}
.dow-toggle{display:flex;gap:6px;margin-top:6px}
.dow-toggle button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:#faf9f6;font-family:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.dow-toggle button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mini-add{position:absolute;right:0;top:0;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;font-weight:400}
.rec-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;background:#faf9f6}
.rec-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rec-top select,.rec-top input{padding:8px;font-size:12.5px;border-radius:9px;min-width:0}
.rec-top .rcourse{flex:1 1 96px}
.rec-top .rdue{flex:1 1 78px}
.rec-top .rhr,.rec-top .rmin{flex:0 0 52px;text-align:center}
.rec-top .rdel{flex:none;background:none;border:none;color:#b83232;font-size:17px;cursor:pointer;padding:2px 4px}
.rec-title{margin-top:8px;width:100%;padding:8px;font-size:13px;border-radius:9px;border:1px solid var(--line)}
.rec-bottom{display:flex;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.same-toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
.same-toggle input{width:16px;height:16px;margin:0}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="nav">
      <button onclick="shift(-1)">‹</button>
      <button onclick="shift(1)">›</button>
      <button class="today-btn" onclick="goToday()">오늘</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="icon-btn" onclick="openSheet('assignSheet')">📋 과제</button>
      <button class="icon-btn" onclick="openSheet('settingsSheet')">⚙️</button>
    </div>
  </div>
  <h1 id="dateTitle"></h1>
  <div class="sub" id="dateSub"></div>
  <div class="progress"><i id="prog"></i></div>
</header>

<main id="main"></main>

<div class="fab">
  <button class="secondary" onclick="openAddTask()">+ 이 날 할 일</button>
  <button class="primary" onclick="openAddAssign()">+ 과제 추가</button>
</div>

<!-- 과제 추가 (마감일 기반, 요일도 자동 배정) -->
<div class="sheet-bg" id="addAssign" onclick="bgClose(event,'addAssign')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>과제 추가</h2>
    <p class="small">마감일과 예상 시간만 넣으면 어느 요일 몇 시부터 할지 전부 자동으로 배정돼요.</p>
    <label>과제 이름</label><input id="aTitle" placeholder="예: Roadmap Exercise 초안">
    <div class="row">
      <div><label>과목</label><select id="aCourse"></select></div>
      <div><label>마감일</label><input id="aDue" type="date"></div>
    </div>
    <div class="row">
      <div style="flex:1"><label>예상 소요 시간</label>
        <div class="wheelpicker">
          <div class="wheel-highlight"></div>
          <div class="wheel-col" id="wheelHour"></div>
          <div class="wheel-unit">시간</div>
          <div class="wheel-col" id="wheelMin"></div>
          <div class="wheel-unit">분</div>
        </div>
      </div>
      <div style="flex:1"><label>마감일 당일에도 할 수 있나요?</label><select id="aDueDay"><option value="0">아니오 (전날까지)</option><option value="1">네</option></select></div>
    </div>
    <label>메모</label><textarea id="aMemo" placeholder="제출 방식, 분량, 링크…"></textarea>
    <div class="preview" id="aPreview">마감일과 시간을 넣으면 배정 미리보기가 보여요.</div>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('addAssign')">취소</button><button class="btn-navy" onclick="saveAssign()">배정하기</button></div>
  </div>
</div>

<!-- 이 날 할 일 추가 (날짜는 고정, 시간은 자동 배치) -->
<div class="sheet-bg" id="addTask" onclick="bgClose(event,'addTask')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>이 날 할 일 추가</h2>
    <p class="small">이 날짜에 고정되고, 시작 시간부터 순서대로 자동 배치돼요.</p>
    <label>할 일</label><input id="tTitle" placeholder="예: 오피스아워 질문 정리">
    <label>과목</label><select id="tCourse"></select>
    <label>예상 소요 시간</label>
    <div class="wheelpicker">
      <div class="wheel-highlight"></div>
      <div class="wheel-col" id="wheelHourX"></div>
      <div class="wheel-unit">시간</div>
      <div class="wheel-col" id="wheelMinX"></div>
      <div class="wheel-unit">분</div>
    </div>
    <label>메모</label><textarea id="tMemo"></textarea>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('addTask')">취소</button><button class="btn-navy" onclick="saveTask()">추가</button></div>
  </div>
</div>

<!-- 과제 목록 -->
<div class="sheet-bg" id="assignSheet" onclick="bgClose(event,'assignSheet')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>과제 목록</h2>
    <div id="assignList"></div>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('assignSheet')">닫기</button></div>
  </div>
</div>

<!-- 설정 -->
<div class="sheet-bg" id="settingsSheet" onclick="bgClose(event,'settingsSheet')">
  <div class="sheet">
    <div class="handle"></div>
    <h2>공부 시간 설정</h2>
    <div class="row">
      <div><label>공부 시작 시간</label><input type="time" id="setStart"></div>
      <div><label>마감 마지노선 (다음날 새벽)</label><input type="time" id="setCutoff"></div>
    </div>
    <label>공부하는 요일</label>
    <div class="dow-toggle" id="dowToggle"></div>

    <h2 style="margin-top:28px">매주 반복 항목<button class="mini-add" onclick="addRecurring()">+ 추가</button></h2>
    <p class="small">마감 요일까지 자동으로 요일·시간이 배치돼요. "당일에만"을 켜면 복습처럼 그 요일에만, 끄면 예습처럼 마감 요일 전 여유 있는 날에 배치돼요.</p>
    <div id="recEditor"></div>

    <h2 style="margin-top:28px">백업</h2>
    <div class="row">
      <button class="btn-ghost" style="border:none;border-radius:12px;padding:12px;font-family:inherit" onclick="exportJSON()">JSON 내보내기</button>
      <button class="btn-ghost" style="border:none;border-radius:12px;padding:12px;font-family:inherit" onclick="document.getElementById('importFile').click()">JSON 불러오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
    </div>
    <div class="btns"><button class="btn-ghost" onclick="closeSheet('settingsSheet')">닫기</button><button class="btn-navy" onclick="saveSettings()">저장</button></div>
  </div>
</div>

<script>
/* ---------- 기본 데이터 ---------- */
const COURSES = {
  torts:{name:"Torts",color:"var(--torts)"},
  contracts:{name:"Contracts",color:"var(--contracts)"},
  civpro:{name:"Civil Procedure",color:"var(--civpro)"},
  ls:{name:"Lawyering Skills",color:"var(--ls)"},
  mr:{name:"Moral Reasoning",color:"var(--mr)"},
  etc:{name:"기타",color:"var(--etc)"}
};
const CLASSES = {
  1:[["torts","9:00","MSL 235"],["contracts","10:30","MSL 235"],["civpro","1:30 pm","MSL 321"]],
  2:[["ls","8:55","SCH 314"],["mr","10:30","Rm 321/235"],["civpro","1:30 pm","MSL 321"]],
  3:[["torts","9:00","MSL 235"],["contracts","10:30","MSL 235"]],
  4:[["ls","8:55","SCH 314"],["torts","10:30","MSL 235"],["civpro","1:30 pm","MSL 321"]],
  5:[["contracts","10:30","MSL 235"]]
};
const DOW=["일","월","화","수","목","금","토"];

// 매주 반복 항목: dueDow = 이 항목이 대비하는 수업 요일(마감), sameDay = 그 요일에만(복습형) / false면 마감 전 여유 날에 배치(예습형)
const DEFAULT_RECURRING = [
  {title:"복습 (오늘 수업 3과목)", course:"etc", estMin:60, dueDow:1, sameDay:true, memo:"Torts·Contracts·CivPro 각 20분 — 교수님 질문 적기"},
  {title:"예습 (교재+판례) — 화요일 CivPro 수업", course:"civpro", estMin:120, dueDow:2, sameDay:false, memo:""},
  {title:"예습 — 화요일 Lawyering Skills + Moral Reasoning", course:"ls", estMin:90, dueDow:2, sameDay:false, memo:""},
  {title:"예습 (교재+판례) — 수요일 Torts 수업", course:"torts", estMin:180, dueDow:3, sameDay:false, memo:""},
  {title:"복습 (판례정리)", course:"civpro", estMin:30, dueDow:2, sameDay:true, memo:""},
  {title:"예습 (교재+판례) — 수요일 Contracts 수업", course:"contracts", estMin:150, dueDow:3, sameDay:false, memo:"단어장 · 양측 논거까지"},
  {title:"콜드콜 스크립트 — 수요일 Contracts", course:"contracts", estMin:90, dueDow:3, sameDay:false, memo:""},
  {title:"콜드콜 스크립트 — 수요일 Torts", course:"torts", estMin:90, dueDow:3, sameDay:false, memo:""},
  {title:"복습 (Torts·Contracts)", course:"etc", estMin:30, dueDow:3, sameDay:true, memo:"1:30–2:45 Torts 오피스아워 가능"},
  {title:"예습 (교재+판례) — 목요일 Torts 수업", course:"torts", estMin:150, dueDow:4, sameDay:false, memo:""},
  {title:"예습 (교재+판례) — 목요일 CivPro 수업", course:"civpro", estMin:120, dueDow:4, sameDay:false, memo:""},
  {title:"예습 — 목요일 Lawyering Skills", course:"ls", estMin:60, dueDow:4, sameDay:false, memo:""},
  {title:"콜드콜 스크립트 — 목요일 Torts+CivPro", course:"etc", estMin:60, dueDow:4, sameDay:false, memo:""},
  {title:"복습 (Torts·CivPro)", course:"etc", estMin:30, dueDow:4, sameDay:true, memo:""},
  {title:"예습 (교재+판례) — 금요일 Contracts 수업", course:"contracts", estMin:150, dueDow:5, sameDay:false, memo:""},
  {title:"콜드콜 스크립트 + 단어장 — 금요일 Contracts", course:"contracts", estMin:90, dueDow:5, sameDay:false, memo:""},
  {title:"주간 정리 — 케이스별 룰 한 줄씩 아웃라인에", course:"etc", estMin:120, dueDow:5, sameDay:false, memo:""},
  {title:"복습 (판례정리)", course:"contracts", estMin:30, dueDow:5, sameDay:true, memo:"Grenardo 오피스아워 12–1:30"},
  {title:"예습 (교재+판례) — 월요일 Torts 수업", course:"torts", estMin:150, dueDow:1, sameDay:false, memo:""},
  {title:"예습 (교재+판례) — 월요일 Contracts 수업", course:"contracts", estMin:120, dueDow:1, sameDay:false, memo:""},
  {title:"예습 (교재+판례) — 월요일 CivPro 수업", course:"civpro", estMin:90, dueDow:1, sameDay:false, memo:""},
  {title:"콜드콜 스크립트 3개 — 월요일 Torts·Contracts·CivPro", course:"etc", estMin:60, dueDow:1, sameDay:false, memo:""}
].map((t,i)=>({id:"rc"+i, ...t}));
const DEFAULT_ACTIVE = {0:0,1:1,2:1,3:1,4:1,5:1,6:0}; // 0=일 ... 6=토, 1=공부함
const DEFAULT_START="15:30", DEFAULT_CUTOFF="00:30";

const KEY="onel_daily_v2";
let S = load();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){
      const s=JSON.parse(raw);
      s.recurring=s.recurring||DEFAULT_RECURRING;
      s.activeDow=s.activeDow||{...DEFAULT_ACTIVE};
      s.studyStart=s.studyStart||DEFAULT_START;
      s.cutoff=s.cutoff||DEFAULT_CUTOFF;
      s.done=s.done||{}; s.memos=s.memos||{}; s.titles=s.titles||{}; s.extras=s.extras||{}; s.assignments=s.assignments||[];
      // 옛 버전(시간표 고정형) 데이터가 있으면 자동 변환
      if(s.template && !raw.includes('"recurring"')){
        s.recurring = s.template.map((t,i)=>({id:"rc"+i, title:t.title, course:t.course, estMin:t.dur, dueDow:t.dow===0?1:t.dow, sameDay:/복습/.test(t.title), memo:t.memo||""}));
        if(s.cap) s.activeDow = Object.fromEntries([0,1,2,3,4,5,6].map(d=>[d, (s.cap[d]||0)>0?1:0]));
      }
      (s.assignments||[]).forEach(a=>{ if(a.min && !a.estMin) a.estMin=a.min; if(a.dueDayAllowed!==undefined && a.allowDueDay===undefined) a.allowDueDay=a.dueDayAllowed; });
      Object.values(s.extras||{}).forEach(list=>list.forEach(x=>{ if(!x.estMin) x.estMin = x.time?30:( x.estMin||30); }));
      return s;
    }
  }catch(e){}
  return {studyStart:DEFAULT_START, cutoff:DEFAULT_CUTOFF, activeDow:{...DEFAULT_ACTIVE}, recurring:DEFAULT_RECURRING.map(r=>({...r})), done:{}, memos:{}, titles:{}, extras:{}, assignments:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- 날짜 유틸 ---------- */
let cur = new Date(); cur.setHours(0,0,0,0);
const iso = d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const fromISO = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function shift(n){cur.setDate(cur.getDate()+n);render()}
function goToday(){cur=new Date();cur.setHours(0,0,0,0);render()}
function nextDow(from, dow){ const d=new Date(from); const diff=(dow - d.getDay() + 7)%7; d.setDate(d.getDate()+diff); return d; }
const fmtDur = m=> m%60===0?`${m/60}h`:(m>60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`);
function fmtClock(minFromMidnight){
  let m=((minFromMidnight%1440)+1440)%1440; let h=Math.floor(m/60), mm=m%60;
  const ap=h<12?"오전":"오후"; let hh=h%12; if(hh===0)hh=12;
  return `${ap} ${hh}:${String(mm).padStart(2,"0")}`;
}
function toMinutes(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }

/* ---------- 자동 스케줄러 ---------- */
function minutesRange(startHHMM,endHHMM){
  let s=toMinutes(startHHMM), e=toMinutes(endHHMM);
  if(e<=s) e+=1440;
  return e-s;
}
function dailyCap(date){ return S.activeDow[date.getDay()] ? minutesRange(S.studyStart,S.cutoff) : 0; }

function generateJobs(horizonDays){
  const today=new Date(); today.setHours(0,0,0,0);
  const jobs=[];
  S.assignments.forEach(a=>{
    jobs.push({id:a.id, title:a.title, course:a.course, min:a.estMin, due:a.due, windowDays:99999, allowDueDay:!!a.allowDueDay, memo:a.memo, kind:"assign"});
  });
  const weeks=Math.ceil(horizonDays/7)+1;
  S.recurring.forEach(r=>{
    for(let w=0; w<weeks; w++){
      let due=nextDow(today, r.dueDow); due.setDate(due.getDate()+7*w);
      if((due-today)/86400000 > horizonDays) continue;
      jobs.push({id:r.id+"@"+iso(due), title:r.title, course:r.course, min:r.estMin, due:iso(due), windowDays:r.sameDay?0:6, allowDueDay:!!r.sameDay, memo:r.memo, kind:"recurring", dueDow:r.dueDow});
    }
  });
  return jobs;
}
function placeJob(job, used, today){
  const due=fromISO(job.due);
  let start=new Date(due); start.setDate(start.getDate()-job.windowDays);
  if(start<today) start=new Date(today);
  let last=new Date(due); if(!job.allowDueDay) last.setDate(last.getDate()-1);
  if(last<start) last=new Date(start);
  const days=[];
  for(let d=new Date(start); d<=last; d.setDate(d.getDate()+1)){
    const ds=iso(d); const free=dailyCap(d)-(used[ds]||0);
    if(free>0) days.push({date:ds,free});
  }
  days.sort((a,b)=>b.free-a.free || a.date.localeCompare(b.date));
  let need=job.min; const chunks=[];
  for(const d of days){ if(need<=0)break; const take=Math.min(need,d.free); chunks.push({date:d.date,min:take}); used[d.date]=(used[d.date]||0)+take; need-=take; }
  let overflow=0;
  if(need>0){ const ds=iso(due); const ex=chunks.find(c=>c.date===ds); if(ex) ex.min+=need; else chunks.push({date:ds,min:need}); used[ds]=(used[ds]||0)+need; overflow=need; }
  return {chunks, overflow};
}
function computeSchedule(previewJob){
  const today=new Date(); today.setHours(0,0,0,0);
  const jobs=generateJobs(70);
  if(previewJob) jobs.push(previewJob);
  jobs.sort((a,b)=>a.due.localeCompare(b.due));
  const used={};
  Object.entries(S.extras).forEach(([ds,list])=>{ used[ds]=(used[ds]||0)+list.reduce((s,x)=>s+(x.estMin||0),0); });
  const result=[];
  jobs.forEach(job=>{
    const {chunks, overflow}=placeJob(job, used, today);
    chunks.forEach(c=>result.push({...job, date:c.date, min:c.min, overflow: overflow>0 && c.date===chunks[chunks.length-1].date}));
  });
  return result;
}

/* ---------- 렌더 ---------- */
function render(){
  const ds=iso(cur), dow=cur.getDay();
  document.getElementById("dateTitle").textContent=`${cur.getMonth()+1}월 ${cur.getDate()}일 (${DOW[dow]})`;
  const sched = computeSchedule();
  const items=[];
  (S.extras[ds]||[]).forEach(t=>items.push({key:ds+":"+t.id, course:t.course, title:t.title, memoDefault:t.memo, min:t.estMin, type:"extra", id:t.id, dueRaw:ds, dueLabel:null}));
  sched.filter(c=>c.date===ds).forEach(c=>{
    if(c.kind==="assign"){
      const due=fromISO(c.due); const left=Math.round((due-cur)/86400000);
      items.push({key:ds+":"+c.id, course:c.course, title:c.title, memoDefault:c.memo, min:c.min, type:"assign", dueRaw:c.due, dueLabel:`과제 · 마감 ${due.getMonth()+1}/${due.getDate()}`, left, overflow:c.overflow});
    } else {
      const sameDayItem = c.date===c.due;
      items.push({key:ds+":"+c.id, course:c.course, title:c.title, memoDefault:c.memo, min:c.min, type:"recurring", dueRaw:c.due, dueLabel: sameDayItem?null:`${DOW[c.dueDow]}요일 대비`, overflow:c.overflow});
    }
  });
  items.sort((a,b)=>a.dueRaw.localeCompare(b.dueRaw));
  let clock = toMinutes(S.studyStart);
  items.forEach(i=>{ i.timeMin=clock; clock+=i.min; });

  const doneN=items.filter(i=>S.done[i.key]).length;
  const cap=dailyCap(cur);
  document.getElementById("dateSub").textContent = items.length?`${doneN}/${items.length} 완료 · 총 ${fmtDur(items.reduce((a,i)=>a+i.min,0))}${cap?` / ${fmtDur(cap)} 가능`:""}`:(cap===0?"쉬는 날 🌿":"할 일 없음");
  document.getElementById("prog").style.width=(items.length?doneN/items.length*100:0)+"%";

  let html="";
  if(items.length){
    html+=`<div class="section-label">할 일</div>`;
    items.forEach(i=>{
      const memo = S.memos[i.key] ?? i.memoDefault ?? "";
      const title = S.titles[i.key] ?? i.title ?? "";
      const c=COURSES[i.course]||COURSES.etc;
      html+=`<div class="task ${S.done[i.key]?"done":""}">
        <div class="check" onclick="toggle('${i.key}')">${S.done[i.key]?"✓":""}</div>
        <div class="bar" style="background:${c.color}"></div>
        <div class="body">
          <div class="title-row"><span class="title-text" contenteditable="true" data-key="${i.key}" data-default="${esc(i.title)}" onblur="saveTitle(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(title)}</span>${i.dueLabel?`<span class="tag ${i.type==='assign'&&i.left<=1?"warn":""}">${i.dueLabel}</span>`:""}${i.overflow?`<span class="tag warn">⚠ 시간 부족</span>`:""}</div>
          <div class="meta">${c.name} · ${fmtClock(i.timeMin)} · ${fmtDur(i.min)}</div>
          <div class="memo" contenteditable="true" data-key="${i.key}" data-empty="${memo?0:1}" onblur="saveMemo(this)" oninput="this.dataset.empty=this.textContent.trim()?0:1">${esc(memo)}</div>
        </div>
        ${i.type==="extra"?`<button class="del" onclick="delExtra('${ds}','${i.id}')">✕</button>`:""}
      </div>`;
    });
  } else html+=`<div class="empty">${cap===0?"쉬는 날이에요.<br>푹 쉬어요 ☕":"이 날은 아직 할 일이 없어요.<br>아래에서 추가할 수 있어요."}</div>`;

  if(CLASSES[dow]){
    html+=`<div class="section-label">수업</div>`;
    CLASSES[dow].forEach(([k,t,room])=>{const c=COURSES[k];html+=`<div class="class-card"><div class="bar" style="background:${c.color}"></div><div><b>${c.name} 수업</b><span style="font-size:13px">${t.includes("pm")?"오후 "+t.replace(" pm",""):"오전 "+t} · ${room}</span></div></div>`});
  }
  document.getElementById("main").innerHTML=html;
}
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function toggle(k){ if(S.done[k]) delete S.done[k]; else S.done[k]=1; save(); render(); }
function saveMemo(el){ const v=el.textContent.trim(); S.memos[el.dataset.key]=v; save(); }
function saveTitle(el){ const v=el.textContent.trim(); if(v) S.titles[el.dataset.key]=v; else { delete S.titles[el.dataset.key]; el.textContent=el.dataset.default; } save(); }
function delExtra(ds,id){ S.extras[ds]=(S.extras[ds]||[]).filter(t=>t.id!==id); save(); render(); }

/* ---------- 시트 공통 ---------- */
function openSheet(id){ if(id==="assignSheet") renderAssignList(); if(id==="settingsSheet") renderRecEditor(); document.getElementById(id).classList.add("open"); }
function closeSheet(id){ document.getElementById(id).classList.remove("open"); }
function bgClose(e,id){ if(e.target.id===id) closeSheet(id); }
function fillCourses(sel){ sel.innerHTML=Object.entries(COURSES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join(""); }
fillCourses(document.getElementById("aCourse")); fillCourses(document.getElementById("tCourse"));

/* ---------- 소요시간 휠 피커 (재사용) ---------- */
function buildWheel(id, values, fmt, initial, onChange){
  const col=document.getElementById(id);
  col.innerHTML = `<div class="wheel-pad"></div>` + values.map(v=>`<div class="wheel-item" data-v="${v}">${fmt(v)}</div>`).join("") + `<div class="wheel-pad"></div>`;
  const items=[...col.querySelectorAll(".wheel-item")];
  function updateSel(scrollTo){
    const idx=Math.min(Math.max(Math.round(col.scrollTop/40),0),values.length-1);
    items.forEach((it,i)=>it.classList.toggle("sel",i===idx));
    onChange(values[idx]);
    if(scrollTo) col.scrollTo({top:idx*40,behavior:"smooth"});
    return idx;
  }
  let t;
  col.addEventListener("scroll",()=>{ updateSel(false); clearTimeout(t); t=setTimeout(()=>updateSel(true),120); });
  const startIdx=Math.max(0,values.indexOf(initial));
  col.scrollTop=startIdx*40;
  setTimeout(()=>updateSel(false),0);
}
const HOURV=[...Array(11).keys()], MINV=[0,5,10,15,20,25,30,35,40,45,50,55];
const pad2=v=>String(v).padStart(2,"0");

let wheelHourVal=1, wheelMinVal=0;
function setupWheels(h,m){ wheelHourVal=h; wheelMinVal=m; buildWheel("wheelHour",HOURV,v=>v,h,v=>{wheelHourVal=v;previewAssign();}); buildWheel("wheelMin",MINV,pad2,m,v=>{wheelMinVal=v;previewAssign();}); }
let xHourVal=1, xMinVal=0;
function setupWheelsX(h,m){ xHourVal=h; xMinVal=m; buildWheel("wheelHourX",HOURV,v=>v,h,v=>{xHourVal=v;}); buildWheel("wheelMinX",MINV,pad2,m,v=>{xMinVal=v;}); }

/* ---------- 과제 추가 ---------- */
function previewAssign(){
  const totalMin=wheelHourVal*60+wheelMinVal, due=document.getElementById("aDue").value;
  const box=document.getElementById("aPreview");
  if(!totalMin||!due){box.textContent="마감일과 시간을 넣으면 배정 미리보기가 보여요.";return}
  const candidate={id:"preview", title:"", course:"etc", min:totalMin, due, windowDays:99999, allowDueDay:document.getElementById("aDueDay").value==="1", kind:"assign"};
  const sched=computeSchedule(candidate).filter(c=>c.id==="preview");
  if(!sched.length){ box.textContent="배정할 수 있는 날이 없어요 — 마감일이나 시간을 조정해봐요."; return; }
  box.innerHTML = sched.map(c=>{const d=fromISO(c.date);return `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]}) · ${fmtDur(c.min)}`}).join("<br>") + (sched.some(c=>c.overflow)?`<br><span style="color:#b83232">⚠ 여유가 부족해서 마감일에 몰렸어요.</span>`:"");
}
document.getElementById("aDue").addEventListener("input",previewAssign);
document.getElementById("aDueDay").addEventListener("input",previewAssign);
function openAddAssign(){ document.getElementById("aTitle").value="";document.getElementById("aMemo").value="";document.getElementById("aDue").value="";document.getElementById("aDueDay").value="0";setupWheels(1,0);previewAssign();openSheet("addAssign"); }
function saveAssign(){
  const title=document.getElementById("aTitle").value.trim(), totalMin=wheelHourVal*60+wheelMinVal, due=document.getElementById("aDue").value;
  if(!title||!totalMin||!due){alert("과제 이름, 마감일, 예상 시간을 채워주세요.");return}
  S.assignments.push({id:"a"+Date.now(), title, course:document.getElementById("aCourse").value, due, estMin:totalMin, memo:document.getElementById("aMemo").value.trim(), allowDueDay:document.getElementById("aDueDay").value==="1"});
  save(); closeSheet("addAssign"); render();
}
function renderAssignList(){
  const box=document.getElementById("assignList");
  if(!S.assignments.length){box.innerHTML=`<div class="empty">아직 추가된 과제가 없어요.</div>`;return}
  const sched=computeSchedule();
  box.innerHTML=S.assignments.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(a=>{
    const chunks=sched.filter(c=>c.kind==="assign" && c.id===a.id);
    const done=chunks.length && chunks.every(c=>S.done[c.date+":"+a.id]);
    const plan=chunks.map(c=>{const d=fromISO(c.date);return `${d.getMonth()+1}/${d.getDate()} ${fmtDur(c.min)}`}).join(" · ");
    return `<div class="list-item"><div><span style="color:${COURSES[a.course].color}">●</span> ${done?"<s>":""}${esc(a.title)}${done?"</s>":""}<small>${COURSES[a.course].name} · 마감 ${a.due} · ${fmtDur(a.estMin)}</small><small>${plan||"배정 실패"}</small></div><button onclick="delAssign('${a.id}')">삭제</button></div>`;
  }).join("");
}
function delAssign(id){ if(!confirm("이 과제를 지울까요?"))return; S.assignments=S.assignments.filter(a=>a.id!==id); save(); renderAssignList(); render(); }

/* ---------- 이 날 할 일 추가 ---------- */
function openAddTask(){ document.getElementById("tTitle").value="";document.getElementById("tMemo").value="";setupWheelsX(0,30);openSheet("addTask"); }
function saveTask(){
  const title=document.getElementById("tTitle").value.trim(); if(!title){alert("할 일을 적어주세요.");return}
  const estMin=xHourVal*60+xMinVal; if(!estMin){alert("예상 소요 시간을 정해주세요.");return}
  const ds=iso(cur); S.extras[ds]=S.extras[ds]||[];
  S.extras[ds].push({id:"x"+Date.now(), title, course:document.getElementById("tCourse").value, estMin, memo:document.getElementById("tMemo").value.trim()});
  save(); closeSheet("addTask"); render();
}

/* ---------- 설정: 시작시간/요일/반복항목 ---------- */
function renderRecEditor(){
  document.getElementById("setStart").value=S.studyStart;
  document.getElementById("setCutoff").value=S.cutoff;
  document.getElementById("dowToggle").innerHTML=[1,2,3,4,5,6,0].map(d=>`<button type="button" class="${S.activeDow[d]?"on":""}" onclick="toggleDow(${d})">${DOW[d]}</button>`).join("");
  document.getElementById("recEditor").innerHTML = S.recurring.map(r=>`
    <div class="rec-card" data-id="${r.id}">
      <div class="rec-top">
        <select class="rcourse">${Object.entries(COURSES).map(([k,v])=>`<option value="${k}" ${r.course===k?"selected":""}>${v.name}</option>`).join("")}</select>
        <select class="rdue">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${r.dueDow===d?"selected":""}>${DOW[d]}요일</option>`).join("")}</select>
        <input type="number" class="rhr" min="0" value="${Math.floor(r.estMin/60)}" title="시간">
        <select class="rmin"><option value="0" ${r.estMin%60===0?"selected":""}>00</option><option value="15" ${r.estMin%60===15?"selected":""}>15</option><option value="30" ${r.estMin%60===30?"selected":""}>30</option><option value="45" ${r.estMin%60===45?"selected":""}>45</option></select>
        <button class="rdel" onclick="delRecurring('${r.id}')">✕</button>
      </div>
      <input class="rec-title" value="${esc(r.title)}" placeholder="할 일 이름">
      <div class="rec-bottom"><label class="same-toggle"><input type="checkbox" class="rsame" ${r.sameDay?"checked":""}> 당일에만 (복습형)</label></div>
    </div>`).join("");
}
function toggleDow(d){ S.activeDow[d]=S.activeDow[d]?0:1; renderRecEditor(); }
function addRecurring(){ collectRecSettings(); S.recurring.push({id:"rc"+Date.now(), title:"새 반복 항목", course:"etc", estMin:60, dueDow:1, sameDay:false, memo:""}); renderRecEditor(); }
function delRecurring(id){ collectRecSettings(); S.recurring=S.recurring.filter(r=>r.id!==id); renderRecEditor(); }
function collectRecSettings(){
  S.studyStart=document.getElementById("setStart").value||S.studyStart;
  S.cutoff=document.getElementById("setCutoff").value||S.cutoff;
  document.querySelectorAll("#recEditor .rec-card").forEach(card=>{
    const r=S.recurring.find(x=>x.id===card.dataset.id); if(!r)return;
    r.course=card.querySelector(".rcourse").value;
    r.dueDow=parseInt(card.querySelector(".rdue").value);
    r.estMin=(parseInt(card.querySelector(".rhr").value)||0)*60+parseInt(card.querySelector(".rmin").value);
    r.title=card.querySelector(".rec-title").value;
    r.sameDay=card.querySelector(".rsame").checked;
  });
}
function saveSettings(){ collectRecSettings(); save(); closeSheet("settingsSheet"); render(); }

function exportJSON(){ const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`1L-daily-${iso(new Date())}.json`; a.click(); }
function importJSON(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const p=JSON.parse(r.result); p.recurring=p.recurring||DEFAULT_RECURRING; p.activeDow=p.activeDow||{...DEFAULT_ACTIVE}; p.studyStart=p.studyStart||DEFAULT_START; p.cutoff=p.cutoff||DEFAULT_CUTOFF; p.done=p.done||{}; p.memos=p.memos||{}; p.titles=p.titles||{}; p.extras=p.extras||{}; p.assignments=p.assignments||{}; S=p; save(); render(); alert("불러왔어요."); }catch(e){alert("파일을 읽지 못했어요.")} }; r.readAsText(f); }

render();
