<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1L Daily</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1L Daily">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6B4FD8">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon-120.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --accent:#6B4FD8; --accent-deep:#4A35A8; --accent-soft:#EEEAFB; --accent-tint:#F7F5FE;
  --paper:#F7F6FB; --card:#FFFFFF; --ink:#1F1B2E; --muted:#7C7791; --line:#E6E3F0; --line-soft:#F0EEF7;
  --torts:#1B9C8E; --contracts:#7C4DCC; --civpro:#E08A2B; --ls:#D14A6A; --mr:#B5782B; --etc:#6B7F95;
  --r:18px; --rail:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 헤더 ---------- */
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--accent-tint) 0%,var(--paper) 100%);padding:calc(10px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{display:flex;align-items:center;gap:2px}
.nav button{background:none;border:none;font-size:22px;padding:6px 10px;color:var(--ink);cursor:pointer;border-radius:10px}
.nav .pill{font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px}
.nav button:active{background:var(--accent-soft)}
.pill{font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;color:var(--ink);cursor:pointer}
.pill.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.hd-main{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px}
.date-big{display:flex;align-items:baseline;gap:8px}
.date-big b{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:var(--accent-deep)}
.date-big span{font-size:15px;color:var(--muted);font-weight:500}
.date-big .dowtag{background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px;letter-spacing:.02em}
.date-big .dowtag.rest{background:var(--muted)}
.sub{color:var(--muted);font-size:12.5px;margin-top:6px}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .35s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--accent-deep)}

/* ---------- 타임라인 ---------- */
main{padding:6px 14px 0}
.section{font-size:11.5px;color:var(--muted);letter-spacing:.08em;margin:16px 6px 8px;text-transform:uppercase;font-weight:600}
.tl{position:relative}
.tl:before{content:"";position:absolute;left:calc(var(--rail) - 12px);top:10px;bottom:10px;width:2px;background:var(--line);border-radius:2px}
.row{display:flex;gap:0;margin-bottom:10px;position:relative}
.rail{flex:none;width:var(--rail);padding-top:15px;position:relative}
.rail time{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.2px;line-height:1.1}
.rail small{display:block;font-size:10px;color:#B3AFC6;margin-top:2px}
.rail:after{content:"";position:absolute;right:7px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--dot,var(--accent))}
.row.done .rail:after{background:var(--dot,var(--accent))}
.card{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 11px 12px;display:flex;gap:10px;box-shadow:0 1px 0 rgba(31,27,46,.03);position:relative;transition:opacity .2s}
.row.done .card{opacity:.5}
.row.done .title{text-decoration:line-through;text-decoration-color:var(--muted)}
.chk{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;color:#fff;font-size:14px;cursor:pointer;margin-top:1px;transition:transform .12s}
.chk:active{transform:scale(.9)}
.row.done .chk{background:var(--accent);border-color:var(--accent)}
.cbody{flex:1;min-width:0}
.crs{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--dot,var(--accent));margin-bottom:3px}
.crs:before{content:"";width:7px;height:7px;border-radius:2px;background:var(--dot,var(--accent))}
.title{font-weight:700;font-size:15.5px;line-height:1.3;outline:none;display:inline}
.title:focus{background:var(--accent-soft);border-radius:6px;padding:1px 4px}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;margin-left:4px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--line-soft);color:var(--muted);font-weight:600;white-space:nowrap}
.tag.late{background:#FDE8E8;color:#B83232}
.tag.due{background:var(--accent-soft);color:var(--accent-deep)}
.dur{font-size:12px;color:var(--muted);margin-top:3px}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sub-i{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 9px 5px 6px;border-radius:9px;background:var(--line-soft);color:#4E4966;cursor:pointer;user-select:none;transition:background .15s}
.sub-i:active{background:var(--accent-soft)}
.sub-i.on{background:var(--accent-soft);color:var(--accent-deep);text-decoration:line-through;text-decoration-color:var(--accent)}
.sub-i i{width:14px;height:14px;border-radius:4px;border:1.5px solid #C9C4DA;background:#fff;display:grid;place-items:center;font-size:9px;font-style:normal;color:#fff;flex:none}
.sub-i.on i{background:var(--accent);border-color:var(--accent)}
.memo{margin-top:7px;font-size:13.5px;line-height:1.5;color:#5A5570;white-space:pre-wrap;outline:none;min-height:18px}
.memo[data-empty="1"]:before{content:"메모 — 리딩 범위 · 판례 · 페이지";color:#B8B3C9}
.memo:focus{background:var(--accent-tint);border-radius:8px;padding:6px 8px}
.del{position:absolute;right:8px;top:8px;background:none;border:none;color:#C4BFD6;font-size:16px;cursor:pointer;padding:4px 6px}
.cls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px var(--rail)}
.cl{display:inline-flex;align-items:center;gap:7px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 11px;font-size:12.5px;color:#6E6985;background:transparent}
.cl i{width:8px;height:8px;border-radius:50%;background:var(--dot);font-style:normal}
.cl b{font-weight:700;color:#4E4966}
.empty{margin-left:var(--rail);color:var(--muted);text-align:center;padding:28px 10px;font-size:14px;line-height:1.6;border:1.5px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- FAB ---------- */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:19px;background:var(--accent);color:#fff;border:none;font-size:30px;line-height:1;box-shadow:0 10px 26px rgba(74,53,168,.32);cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.fab:active{transform:scale(.94)}
.fab-l{position:fixed;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:8px}
.fab-l button{height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);padding:0 14px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 6px 16px rgba(31,27,46,.08);cursor:pointer}

/* ---------- 시트 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(31,27,46,.45);display:none;z-index:10;backdrop-filter:blur(2px)}
.sheet-bg.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:12px 20px calc(30px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.handle{width:40px;height:5px;background:#E1DEEA;border-radius:5px;margin:0 auto 14px}
.grab{margin:-12px -20px 0;padding:12px 20px 4px;touch-action:none;cursor:grab}
.sheet.dragging{transition:none}
.sheet{transition:transform .22s ease}
.sheet h2{font-size:19px;margin:6px 0 12px;position:relative;font-weight:800;letter-spacing:-.3px}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:64px;resize:vertical}
.r2{display:flex;gap:10px}.r2>*{flex:1;min-width:0}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.b-acc{background:var(--accent);color:#fff}.b-ghost{background:var(--line-soft);color:var(--ink)}
.small{font-size:12.5px;color:var(--muted);line-height:1.6}
.preview{background:var(--accent-tint);border:1px solid var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-top:12px;color:#4E4966}
.seg{display:flex;background:var(--line-soft);border-radius:12px;padding:4px;gap:4px;margin-top:4px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 4px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--accent-deep);box-shadow:0 1px 3px rgba(31,27,46,.08)}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px}
.list-item small{color:var(--muted);display:block;font-size:12px}
.list-item button{background:none;border:none;color:#B83232;font-size:13px;cursor:pointer;flex:none}
.wheel{position:relative;display:flex;align-items:center;height:150px;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wheel-hl{position:absolute;left:6px;right:6px;top:55px;height:40px;background:var(--accent-soft);border-radius:10px;pointer-events:none}
.wcol{flex:1;height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1}
.wcol::-webkit-scrollbar{display:none}
.wpad{height:55px}
.witem{height:40px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#C4BFD6;scroll-snap-align:center;font-variant-numeric:tabular-nums}
.witem.sel{color:var(--accent-deep);font-weight:800}
.wunit{width:26px;text-align:center;color:var(--muted);font-size:13px;z-index:1}
.dow{display:flex;gap:6px;margin-top:6px}
.dow button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:13px;color:var(--muted);cursor:pointer;font-weight:600}
.dow button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.startgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.startgrid .sd{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 10px}
.startgrid .sd b{width:18px;font-size:13px;color:var(--accent-deep)}
.startgrid .sd input{padding:7px;font-size:13.5px;border-radius:9px;background:#fff}
.startgrid .sd.off{opacity:.45}
.dragh{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;font-size:19px;cursor:grab;touch-action:none;line-height:1;user-select:none}
.dragh:active{cursor:grabbing;background:var(--accent);color:#fff}
.row{transition:none}
.row.dragging{z-index:60}
.row.dragging .card{box-shadow:0 18px 36px rgba(31,27,46,.24);opacity:.98}
.tl.reorder .card{border-color:var(--accent);border-style:dashed;padding-right:52px;min-height:82px}
.tl.reorder .memo,.tl.reorder .subs{display:none}
.edit-btn{position:absolute;right:6px;top:6px;background:none;border:none;color:#C4BFD6;font-size:18px;cursor:pointer;padding:4px 8px;line-height:1}
.mini{position:absolute;right:0;top:-2px;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;color:var(--ink);cursor:pointer;font-weight:500}
.rc{border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;background:var(--paper)}
.rc-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rc-top select,.rc-top input{padding:8px;font-size:12.5px;border-radius:9px;min-width:0;background:#fff}
.rc-top .rcourse{flex:1 1 96px}.rc-top .rdue{flex:1 1 78px}.rc-top .rhr,.rc-top .rmin{flex:0 0 52px;text-align:center}
.rc-top .rdel{flex:none;background:none;border:none;color:#B83232;font-size:17px;cursor:pointer;padding:2px 4px}
.rc .rtitle,.rc .rsub{margin-top:8px;width:100%;padding:8px;font-size:13px;border-radius:9px;background:#fff}
.rc .lab{font-size:11px;color:var(--muted);margin-top:6px}
.rc-bot{display:flex;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.tog{display:flex;align-items:center;gap:6px;cursor:pointer}
.tog input{width:16px;height:16px;margin:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 2px #fff}
.sw.on{border-color:var(--ink)}
.sw-custom{width:34px;height:34px;border-radius:50%;padding:0;border:1px dashed var(--line);background:#fff;overflow:hidden}
.sw-custom input{width:100%;height:100%;padding:0;border:none;background:none;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="hd-top">
    <div class="nav">
      <button onclick="shift(-1)" aria-label="이전 날">‹</button>
      <button onclick="shift(1)" aria-label="다음 날">›</button>
      <button class="pill" onclick="goToday()">오늘</button>
    </div>
    <div style="display:flex;gap:6px">
      <button class="pill" onclick="openSheet('assignSheet')">할 일 목록</button>
      <button class="pill" onclick="openSheet('settingsSheet')">설정</button>
    </div>
  </div>
  <div class="hd-main">
    <div>
      <div class="date-big" id="dateBig"></div>
      <div class="sub" id="dateSub"></div>
    </div>
    <div class="ring"><svg width="54" height="54" viewBox="0 0 54 54"><circle class="bg" cx="27" cy="27" r="23"/><circle class="fg" id="ringFg" cx="27" cy="27" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"/></svg><b id="ringTxt">0%</b></div>
  </div>
</header>

<main id="main"></main>

<div class="fab-l"><button onclick="openSheet('settingsSheet');setTimeout(()=>document.getElementById('recEditor').scrollIntoView({behavior:'smooth'}),120)">반복 항목</button></div>
<button class="fab" onclick="openAdd()" aria-label="할 일 추가">+</button>

<!-- 할 일 추가 (통합) -->
<div class="sheet-bg" id="addSheet" onclick="bgClose(event,'addSheet')">
  <div class="sheet">
    <div class="grab"><div class="handle"></div></div>
    <h2 id="addTitle">할 일 추가</h2>
    <div class="seg" id="modeSeg">
      <button class="on" data-m="auto" onclick="setMode('auto')">빈 시간에 자동</button>
      <button data-m="due" onclick="setMode('due')">마감일까지</button>
      <button data-m="pin" onclick="setMode('pin')">이 날에 고정</button>
    </div>
    <p class="small" id="modeHint" style="margin:8px 2px 0"></p>
    <label>할 일</label><input id="aTitle" placeholder="예: Roadmap Exercise 초안">
    <div class="r2">
      <div><label>과목</label><select id="aCourse"></select></div>
      <div id="dueWrap"><label id="dueLabel">마감일</label><input id="aDue" type="date"></div>
    </div>
    <label>예상 소요 시간</label>
    <div class="wheel"><div class="wheel-hl"></div><div class="wcol" id="wH"></div><div class="wunit">시간</div><div class="wcol" id="wM"></div><div class="wunit">분</div></div>
    <div id="dueDayWrap"><label>마감일 당일에도 할 수 있나요?</label><select id="aDueDay"><option value="0">아니오 (전날까지)</option><option value="1">네</option></select></div>
    <label>세부 체크 항목 (선택, 쉼표로 구분)</label><input id="aSub" placeholder="예: 교재, 판례, 노트 필기">
    <label>메모</label><textarea id="aMemo" placeholder="분량, 링크, 제출 방식…"></textarea>
    <div class="preview" id="aPreview"></div>
    <div class="btns"><button class="b-ghost" id="addCancel" onclick="closeSheet('addSheet')">취소</button><button class="b-acc" id="addSave" onclick="saveAdd()">추가</button></div>
    <button id="addDelete" class="b-ghost" style="display:none;width:100%;margin-top:10px;border:none;border-radius:14px;padding:13px;color:#B83232;font-weight:700;background:#FDE8E8" onclick="deleteEditing()">이 할 일 삭제</button>
  </div>
</div>

<!-- 반복 항목 개별 수정 -->
<div class="sheet-bg" id="recEditSheet" onclick="bgClose(event,'recEditSheet')">
  <div class="sheet">
    <div class="grab"><div class="handle"></div></div>
    <h2>반복 일정 수정</h2>
    <label>할 일</label><input id="reTitle">
    <div class="r2">
      <div><label>과목</label><select id="reCourse"></select></div>
      <div><label>무슨 요일에 할까요</label><select id="reDoDow"></select></div>
    </div>
    <label>예상 소요 시간</label>
    <div class="wheel"><div class="wheel-hl"></div><div class="wcol" id="wHr"></div><div class="wunit">시간</div><div class="wcol" id="wMr"></div><div class="wunit">분</div></div>
    <label>세부 체크 항목 (쉼표로 구분)</label><input id="reSub">
    <div class="preview" id="rePreview"></div>
    <label style="margin-top:14px">적용 범위</label>
    <div class="seg" id="reScope">
      <button class="on" data-s="all" onclick="setReScope('all')">앞으로 매주</button>
      <button data-s="one" onclick="setReScope('one')">이번 주만</button>
    </div>
    <div class="btns"><button class="b-ghost" onclick="closeSheet('recEditSheet')">취소</button><button class="b-acc" onclick="saveRecEdit()">저장</button></div>
    <button class="b-ghost" style="width:100%;margin-top:10px;border:none;border-radius:14px;padding:13px;color:#B83232;font-weight:700;background:#FDE8E8" onclick="deleteRec()">이 반복 항목 삭제</button>
  </div>
</div>

<!-- 할 일 목록 -->
<div class="sheet-bg" id="assignSheet" onclick="bgClose(event,'assignSheet')">
  <div class="sheet">
    <div class="grab"><div class="handle"></div></div>
    <h2>할 일 목록</h2>
    <p class="small">반복 항목을 제외한, 직접 추가한 것과 밀린 항목이에요.</p>
    <div id="assignList"></div>
    <div class="btns"><button class="b-ghost" onclick="closeSheet('assignSheet')">닫기</button></div>
  </div>
</div>

<!-- 설정 -->
<div class="sheet-bg" id="settingsSheet" onclick="bgClose(event,'settingsSheet')">
  <div class="sheet">

  {id:"rc19", title:"예습 — (월) Contracts", course:"contracts", estMin:120, dueDow:1, sameDay:false, memo:"", subItems:["Knapp 교재", "Chirelstein 교재", "판례 Skim", "판례 필기"]},
  {id:"rc20", title:"예습 — (월) CivPro", course:"civpro", estMin:90, dueDow:1, sameDay:false, memo:"", subItems:["교재", "판례", "노트 필기"]}
];
const DEFAULT_ACTIVE = {0:0,1:1,2:1,3:1,4:1,5:1,6:0};
const DEFAULT_START="15:30", DEFAULT_CUTOFF="00:30", DEFAULT_THEME="#6B4FD8";

const KEY="onel_daily_v2";
let S = load();
function todayISO(){ const t=new Date(); t.setHours(0,0,0,0); return iso(t); }
function load(){
  let s=null;
  try{ const raw=localStorage.getItem(KEY); if(raw) s=JSON.parse(raw); }catch(e){}
  if(!s) s={};
  s.recurring=s.recurring||DEFAULT_RECURRING.map(r=>({...r}));
  s.activeDow=s.activeDow||{...DEFAULT_ACTIVE};
  s.studyStart=s.studyStart||DEFAULT_START; s.cutoff=s.cutoff||DEFAULT_CUTOFF; s.theme=s.theme||DEFAULT_THEME;
  if(!s.startByDow){ s.startByDow={}; [0,1,2,3,4,5,6].forEach(d=>s.startByDow[d]=(s.studyStart===DEFAULT_START&&(d===3||d===5))?"13:00":s.studyStart); }
  s.done=s.done||{}; s.memos=s.memos||{}; s.titles=s.titles||{}; s.extras=s.extras||{}; s.assignments=s.assignments||[]; s.makeupMap=s.makeupMap||{}; s.order=s.order||{}; s.hiddenRec=s.hiddenRec||{};
  (s.assignments).forEach(a=>{ if(a.min && !a.estMin) a.estMin=a.min; if(a.dueDayAllowed!==undefined && a.allowDueDay===undefined) a.allowDueDay=a.dueDayAllowed; });
  Object.values(s.extras).forEach(list=>list.forEach(x=>{ if(!x.estMin) x.estMin=30; }));
  // 첫 실행(또는 이전 버전에서 넘어옴): 실제로 앱을 쓴 적 없는 날은 "밀린 일"이 아님 → 유령 밀린 항목 정리
  if(!s.lastSyncDate){
    const hasDone=id=>Object.keys(s.done).some(k=>k.endsWith(":"+id)&&s.done[k]);
    s.assignments=s.assignments.filter(a=>!(a.makeup && !hasDone(a.id)));
    s.makeupMap={};
    s.lastSyncDate=todayISO();
  }
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- 테마 ---------- */
function hexToRgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function mix(h,target,t){ const a=hexToRgb(h), b=hexToRgb(target); return "#"+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
function applyTheme(hex){
  const r=document.documentElement.style;
  r.setProperty("--accent",hex);
  r.setProperty("--accent-deep",mix(hex,"#000000",.28));
  r.setProperty("--accent-soft",mix(hex,"#ffffff",.86));
  r.setProperty("--accent-tint",mix(hex,"#ffffff",.94));
  r.setProperty("--paper",mix(hex,"#ffffff",.965));
  r.setProperty("--line",mix(hex,"#ffffff",.84));
  r.setProperty("--line-soft",mix(hex,"#ffffff",.92));
  const tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.content=hex;
}
function renderSwatches(){
  const box=document.getElementById("swatches");
  box.innerHTML=THEMES.map(([n,h])=>`<div class="sw ${S.theme===h?"on":""}" style="background:${h}" title="${n}" onclick="setTheme('${h}')"></div>`).join("")
    +`<div class="sw-custom" title="직접 고르기"><input type="color" value="${S.theme}" oninput="setTheme(this.value)"></div>`;
}
function setTheme(h){ S.theme=h; applyTheme(h); save(); renderSwatches(); }

/* ---------- 날짜 유틸 ---------- */
let cur = new Date(); cur.setHours(0,0,0,0);
function iso(d){const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)}
function fromISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function shift(n){cur.setDate(cur.getDate()+n);reorder=false;render()}
function goToday(){cur=new Date();cur.setHours(0,0,0,0);reorder=false;render()}
function nextDow(from, dow){ const d=new Date(from); const diff=(dow - d.getDay() + 7)%7; d.setDate(d.getDate()+diff); return d; }
const fmtDur = m=> m%60===0?`${m/60}h`:(m>60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`);
function fmtClock(min){ let m=((min%1440)+1440)%1440; let h=Math.floor(m/60), mm=m%60; const ap=h<12?"AM":"PM"; let hh=h%12; if(hh===0)hh=12; return `${hh}:${String(mm).padStart(2,"0")}<small>${ap}</small>`; }
function toMinutes(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }

/* ---------- 밀린 일 이월 (실제로 앱을 쓴 날만 대상) ---------- */
function jobFullyDone(jobId){ const suf=":"+jobId; return Object.keys(S.done).some(k=>k.endsWith(suf)&&S.done[k]); }
// jobId(회차)의 하위 항목 중 이미 체크된 인덱스들을 찾아, 남은 하위 항목/시간을 계산
function remainingOf(jobId, subItems, estMin){
  if(!subItems || !subItems.length) return {subItems:subItems||[], estMin, partial:false};
  // 하위 체크 키는 "<날짜>:<jobId>::<idx>" 형태 — 날짜 프리픽스는 무엇이든 매칭
  const doneIdx=new Set();
  const tail="::"; const midSuf=":"+jobId;
  Object.keys(S.done).forEach(k=>{
    if(!S.done[k]) return;
    const p=k.lastIndexOf(tail); if(p<0) return;
    const base=k.slice(0,p); const idx=parseInt(k.slice(p+2),10);
    if(base.endsWith(midSuf) && !isNaN(idx)) doneIdx.add(idx);
  });
  if(!doneIdx.size) return {subItems, estMin, partial:false};
  const rem=subItems.filter((_,i)=>!doneIdx.has(i));
  if(!rem.length) return {subItems:[], estMin:0, partial:true, allDone:true};
  const remMin=Math.max(5, Math.round(estMin*rem.length/subItems.length/5)*5);
  return {subItems:rem, estMin:remMin, partial:true};
}
function syncMakeup(){
  const today=new Date(); today.setHours(0,0,0,0);
  const tIso=iso(today);
  if(S.lastSyncDate>=tIso) return;
  let from=fromISO(S.lastSyncDate); if(today-from>14*86400000) from=addDays(today,-14);
  let changed=false;
  const dueDate=()=>iso(addDays(today,3));
  S.recurring.forEach(r=>{
    let d=new Date(from); const diff=(r.dueDow-d.getDay()+7)%7; d.setDate(d.getDate()+diff);
    for(; d<today; d.setDate(d.getDate()+7)){
      const jobId=r.id+"@"+iso(d);
      if(S.makeupMap[jobId]) continue;
      // 예습형은 전날까지가 작업일 → 그 마지막 작업일에 앱을 쓰고 있었을 때만 "밀림"
      const lastWork=r.sameDay?d:addDays(d,-1);
      if(lastWork<from){ S.makeupMap[jobId]="skip"; continue; }
      if(jobFullyDone(jobId)){ S.makeupMap[jobId]="done"; continue; }
      const rem=remainingOf(jobId, r.subItems||[], r.estMin);
      if(rem.allDone){ S.makeupMap[jobId]="done"; continue; } // 하위 다 체크했으면 완료로 간주
      const mid="mk"+Date.now()+Math.floor(Math.random()*10000);
      S.assignments.push({id:mid, title:r.title, course:r.course, due:dueDate(), estMin:rem.estMin, memo:r.memo, allowDueDay:true, subItems:rem.subItems, makeup:true, from:iso(d), partial:rem.partial});
      S.makeupMap[jobId]=mid; changed=true;
    }
  });
  Object.keys(S.extras).forEach(ds=>{
    if(ds>=tIso) return;
    (S.extras[ds]||[]).forEach(t=>{
      if(S.done[ds+":"+t.id]) return;
      const rem=remainingOf(ds+":"+t.id, t.subItems||[], t.estMin);
      if(rem.allDone) return; // 하위 다 체크 → 이월 안 함
      const mid="mk"+Date.now()+Math.floor(Math.random()*10000);
      S.assignments.push({id:mid, title:t.title, course:t.course, due:dueDate(), estMin:rem.estMin, memo:t.memo, allowDueDay:true, subItems:rem.subItems, makeup:true, from:ds, partial:rem.partial});
      changed=true;
    });
    delete S.extras[ds]; changed=true;
  });
  S.lastSyncDate=tIso; save();
}

/* ---------- 자동 스케줄러 ---------- */
function minutesRange(a,b){ let s=toMinutes(a), e=toMinutes(b); if(e<=s) e+=1440; return e-s; }
function startFor(date){ return (S.startByDow&&S.startByDow[date.getDay()])||S.studyStart; }
function dailyCap(date){ return S.activeDow[date.getDay()] ? minutesRange(startFor(date),S.cutoff) : 0; }
function generateJobs(horizonDays){
  const today=new Date(); today.setHours(0,0,0,0);
  const jobs=[];
  S.assignments.forEach(a=>{
    if(a.due){
      jobs.push({id:a.id, title:a.title, course:a.course, min:a.estMin, due:a.due, windowDays:99999, allowDueDay:!!a.allowDueDay, strategy:"spread", memo:a.memo, subItems:a.subItems||[], makeup:!!a.makeup, partial:!!a.partial, from:a.from, kind:"assign"});
    } else {
      // 빈 시간에 자동: 오늘부터 14일 안에서 가장 빠른 빈 시간
      jobs.push({id:a.id, title:a.title, course:a.course, min:a.estMin, due:iso(addDays(today,14)), windowDays:14, allowDueDay:true, strategy:"early", memo:a.memo, subItems:a.subItems||[], makeup:!!a.makeup, partial:!!a.partial, from:a.from, auto:true, kind:"assign", sortKey:iso(today)});
    }
  });
  const weeks=Math.ceil(horizonDays/7)+1;
  S.recurring.forEach(r=>{
    let base=nextDow(today, r.dueDow);
    if(!r.sameDay && base<=today) base.setDate(base.getDate()+7);
    for(let w=0; w<weeks; w++){
      const due=addDays(base,7*w);
      if((due-today)/86400000 > horizonDays) break;
      if(S.hiddenRec && S.hiddenRec[r.id+"@"+iso(due)]) continue;
      const fixedD = r.doDow!=null?(r.sameDay?iso(nextDow(due,r.doDow)):iso(nextDow(addDays(due,-6),r.doDow))):null;
      jobs.push({id:r.id+"@"+iso(due), rid:r.id, dueISO:iso(due), title:r.title, course:r.course, min:r.estMin, due:iso(due), windowDays:(r.sameDay||r.doDow!=null)?0:6, allowDueDay:!!r.sameDay||fixedD===iso(due), fixedDate:fixedD, allowAfterDue:!!r.sameDay, strategy:r.sameDay?"same":(r.doDow!=null?"pin":"late"), memo:r.memo, subItems:r.subItems||[], kind:"recurring", dueDow:r.dueDow});
    }
  });
  return jobs;
}
function placeJob(job, used, today){
  const due=fromISO(job.due);
  let start=addDays(due,-job.windowDays); if(start<today) start=new Date(today);
  let last=new Date(due); if(!job.allowDueDay) last=addDays(last,-1);
  if(job.fixedDate){ let fd=fromISO(job.fixedDate); if(fd<today) fd=new Date(today); if(fd>due && !job.allowAfterDue) fd=new Date(due); start=new Date(fd); last=new Date(fd); }
  const days=[];
  for(let d=new Date(start); d<=last; d.setDate(d.getDate()+1)){
    const ds=iso(d); const cap=dailyCap(d); const u=used[ds]||0;
    if(cap-u>0) days.push({date:ds, free:cap-u, soft:Math.max(0,cap-60-u)});
  }
  let need=job.min; const chunks=[];
  const take=(d,amt)=>{ if(amt<=0)return; const ex=chunks.find(c=>c.date===d.date); if(ex) ex.min+=amt; else chunks.push({date:d.date,min:amt}); used[d.date]=(used[d.date]||0)+amt; d.free-=amt; d.soft-=amt; need-=amt; };
  if(job.strategy==="late"){
    days.sort((a,b)=>b.date.localeCompare(a.date));
    const whole=days.find(d=>d.soft>=need); if(whole) take(whole,need);
    for(const d of days){ if(need<=0)break; take(d,Math.min(need,d.soft)); }
    for(const d of days){ if(need<=0)break; take(d,Math.min(need,d.free)); }
  } else if(job.strategy==="early"){
    days.sort((a,b)=>a.date.localeCompare(b.date));
    const whole=days.find(d=>d.soft>=need); if(whole) take(whole,need);
    for(const d of days){ if(need<=0)break; take(d,Math.min(need,d.free)); }
  } else {
    days.sort((a,b)=>b.free-a.free || a.date.localeCompare(b.date));
    for(const d of days){ if(need<=0)break; take(d,Math.min(need,d.free)); }
  }
  let overflow=0;
  if(need>0){
    let od=new Date(due); if(!job.allowDueDay) od=addDays(od,-1); if(od<today||job.strategy==="early") od=new Date(today);
    const ds=iso(od); const ex=chunks.find(c=>c.date===ds); if(ex) ex.min+=need; else chunks.push({date:ds,min:need}); used[ds]=(used[ds]||0)+need; overflow=need; need=0;
  }
  chunks.sort((a,b)=>a.date.localeCompare(b.date));
  return {chunks, overflow};
}
function computeSchedule(previewJob){
  const today=new Date(); today.setHours(0,0,0,0);
  const jobs=generateJobs(70);
  if(previewJob) jobs.push(previewJob);
  jobs.sort((a,b)=>(a.sortKey||a.due).localeCompare(b.sortKey||b.due));
  const used={};
  Object.entries(S.extras).forEach(([ds,list])=>{ used[ds]=(used[ds]||0)+list.reduce((s,x)=>s+(x.estMin||0),0); });
  const result=[];
  jobs.forEach(job=>{
    const {chunks, overflow}=placeJob(job, used, today);
    chunks.forEach(c=>result.push({...job, date:c.date, min:c.min, overflow: overflow>0 && c.date===chunks[chunks.length-1].date}));
  });
  return result;
}

/* ---------- 렌더 ---------- */
let reorder=false, lastKeys=[];
/* ---------- 드래그로 순서 변경 ---------- */
let drag=null;
function dragStart(e, key){
  if(!reorder) return;
  const tl=document.querySelector("#main .tl"); if(!tl) return;
  const rows=[...tl.querySelectorAll(".row")];
  const base={}, height={};
  rows.forEach(r=>{ base[r.dataset.key]=r.offsetTop; height[r.dataset.key]=r.offsetHeight; });
  const startY=(e.touches?e.touches[0].clientY:e.clientY);
  const rowEls={}; rows.forEach(r=>rowEls[r.dataset.key]=r);
  drag={ key, curOrder:rows.map(r=>r.dataset.key), base, height, gap:10, startY, dy:0, rowEls };
  rowEls[key].classList.add("dragging");
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  document.addEventListener("pointermove", dragMove);
  document.addEventListener("pointerup", dragEnd);
  document.addEventListener("pointercancel", dragEnd);
  if(e.cancelable) e.preventDefault();
}
function dragMove(e){
  if(!drag) return;
  const y=(e.touches?e.touches[0].clientY:e.clientY);
  drag.dy=y-drag.startY;
  drag.rowEls[drag.key].style.transform=`translateY(${drag.dy}px)`;
  const draggedCenter=drag.base[drag.key]+drag.height[drag.key]/2+drag.dy;
  const others=drag.curOrder.filter(k=>k!==drag.key);
  let y2=0; const centers={};
  others.forEach(k=>{ centers[k]=y2+drag.height[k]/2; y2+=drag.height[k]+drag.gap; });
  let insertIdx=others.length;
  for(let i=0;i<others.length;i++){ if(draggedCenter<centers[others[i]]){ insertIdx=i; break; } }
  const newOrder=others.slice(); newOrder.splice(insertIdx,0,drag.key);
  if(newOrder.join()!==drag.curOrder.join()){
    drag.curOrder=newOrder;
    let yy=0; const fullTop={};
    drag.curOrder.forEach(k=>{ fullTop[k]=yy; yy+=drag.height[k]+drag.gap; });
    others.forEach(k=>{
      const el=drag.rowEls[k]; const delta=fullTop[k]-drag.base[k];

function buildWheel(id, values, fmt, initial, onChange){
  const col=document.getElementById(id);
  col.innerHTML=`<div class="wpad"></div>`+values.map(v=>`<div class="witem">${fmt(v)}</div>`).join("")+`<div class="wpad"></div>`;
  const items=[...col.querySelectorAll(".witem")];
  function upd(snap){ const idx=Math.min(Math.max(Math.round(col.scrollTop/40),0),values.length-1); items.forEach((it,i)=>it.classList.toggle("sel",i===idx)); onChange(values[idx]); if(snap) col.scrollTo({top:idx*40,behavior:"smooth"}); }
  let t; col.addEventListener("scroll",()=>{ upd(false); clearTimeout(t); t=setTimeout(()=>upd(true),120); });
  col.scrollTop=Math.max(0,values.indexOf(initial))*40; setTimeout(()=>upd(false),0);
}

  }
  if(addMode==="pin"){ const ds=document.getElementById("aDue").value||iso(cur); S.extras[ds]=S.extras[ds]||[]; S.extras[ds].push({id:keepId||("x"+Date.now()), title, course, estMin:min, memo, subItems}); }
  else if(addMode==="due"){ const due=document.getElementById("aDue").value; if(!due){ alert("마감일을 넣어주세요."); return; } S.assignments.push({id:keepId||("a"+Date.now()), title, course, due, estMin:min, memo, allowDueDay:document.getElementById("aDueDay").value==="1", subItems, makeup:keepMakeup}); }
  else S.assignments.push({id:keepId||("a"+Date.now()), title, course, due:null, estMin:min, memo, allowDueDay:true, subItems, makeup:keepMakeup});
  save(); closeSheet("addSheet"); render();
}
function renderAssignList(){
  const box=document.getElementById("assignList");
  if(!S.assignments.length){ box.innerHTML=`<div class="empty" style="margin:0"><b>비어 있어요</b>+ 버튼으로 추가한 것과 밀린 항목이 여기 모여요</div>`; return; }
  const sched=computeSchedule();
  box.innerHTML=S.assignments.slice().sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")).map(a=>{
    const chunks=sched.filter(c=>c.kind==="assign"&&c.id===a.id);
    const done=chunks.length&&chunks.every(c=>S.done[c.date+":"+a.id]);
    const plan=chunks.map(c=>{const d=fromISO(c.date);return `${d.getMonth()+1}/${d.getDate()} ${fmtDur(c.min)}`}).join(" · ");
    const kind=a.makeup?"⏰ 밀림":(a.due?`마감 ${a.due.slice(5).replace("-","/")}`:"✨ 자동");
    return `<div class="list-item"><div onclick="closeSheet('assignSheet');openEdit('assign','${a.id}','')" style="flex:1;cursor:pointer"><span style="color:${COURSES[a.course].color}">●</span> ${done?"<s>":""}${esc(a.title)}${done?"</s>":""}<small>${COURSES[a.course].name} · ${kind} · ${fmtDur(a.estMin)}</small><small>${plan||"배정 실패"}</small></div><button onclick="delAssign('${a.id}')">삭제</button></div>`;
  }).join("");
}
function delAssign(id){ if(!confirm("이 할 일을 지울까요?"))return; S.assignments=S.assignments.filter(a=>a.id!==id); save(); renderAssignList(); render(); }

/* ---------- 설정 ---------- */
function renderSettings(){
  renderSwatches();
  document.getElementById("setCutoff").value=S.cutoff;
  document.getElementById("startGrid").innerHTML=[1,2,3,4,5,6,0].map(d=>`<div class="sd ${S.activeDow[d]?"":"off"}"><b>${DOW[d]}</b><input type="time" data-dow="${d}" value="${S.startByDow[d]||S.studyStart}"></div>`).join("");
  document.getElementById("dowToggle").innerHTML=[1,2,3,4,5,6,0].map(d=>`<button type="button" class="${S.activeDow[d]?"on":""}" onclick="toggleDow(${d})">${DOW[d]}</button>`).join("");
  document.getElementById("recEditor").innerHTML=S.recurring.map(r=>`
    <div class="rc" data-id="${r.id}">
      <div class="rc-top">
        <select class="rcourse">${Object.entries(COURSES).map(([k,v])=>`<option value="${k}" ${r.course===k?"selected":""}>${v.name}</option>`).join("")}</select>
        <select class="rdue">${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${r.dueDow===d?"selected":""}>${DOW[d]}요일</option>`).join("")}</select>
        <input type="number" class="rhr" min="0" value="${Math.floor(r.estMin/60)}" title="시간">
        <select class="rmin">${[0,15,30,45].map(m=>`<option value="${m}" ${r.estMin%60===m?"selected":""}>${String(m).padStart(2,"0")}</option>`).join("")}</select>
        <button class="rdel" onclick="delRecurring('${r.id}')">✕</button>
      </div>
      <input class="rtitle" value="${esc(r.title)}" placeholder="할 일 이름">
      <div class="lab">세부 체크 항목 (쉼표로 구분)</div>
      <input class="rsub" value="${esc((r.subItems||[]).join(", "))}" placeholder="예: 교재, 판례, 노트 필기">
      <div class="rc-bot"><label class="tog"><input type="checkbox" class="rsame" ${r.sameDay?"checked":""}> 당일에만 (복습형)</label></div>
    </div>`).join("");
}
function toggleDow(d){ S.activeDow[d]=S.activeDow[d]?0:1; renderSettings(); }
function addRecurring(){ collectSettings(); S.recurring.push({id:"rc"+Date.now(), title:"새 반복 항목", course:"etc", estMin:60, dueDow:1, sameDay:false, memo:"", subItems:[]}); renderSettings(); }
function delRecurring(id){ collectSettings(); S.recurring=S.recurring.filter(r=>r.id!==id); renderSettings(); }
function collectSettings(){
  S.cutoff=document.getElementById("setCutoff").value||S.cutoff;
  document.querySelectorAll("#startGrid input").forEach(i=>{ if(i.value) S.startByDow[i.dataset.dow]=i.value; });
  document.querySelectorAll("#recEditor .rc").forEach(card=>{
    const r=S.recurring.find(x=>x.id===card.dataset.id); if(!r)return;
    r.course=card.querySelector(".rcourse").value; r.dueDow=parseInt(card.querySelector(".rdue").value);
    r.estMin=(parseInt(card.querySelector(".rhr").value)||0)*60+parseInt(card.querySelector(".rmin").value);
    r.title=card.querySelector(".rtitle").value; r.sameDay=card.querySelector(".rsame").checked;
    r.subItems=card.querySelector(".rsub").value.split(",").map(s=>s.trim()).filter(Boolean);
  });
}
function saveSettings(){ collectSettings(); save(); closeSheet("settingsSheet"); render(); }
function exportJSON(){ const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`1L-daily-${todayISO()}.json`; a.click(); }
function importJSON(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ localStorage.setItem(KEY, r.result); S=load(); applyTheme(S.theme); save(); render(); alert("불러왔어요."); }catch(e){ alert("파일을 읽지 못했어요."); } }; r.readAsText(f); }

applyTheme(S.theme);
render();
</script>
</body>
